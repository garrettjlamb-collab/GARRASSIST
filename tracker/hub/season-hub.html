<title>Padres Season Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: the stat book's scoreboard band as a season header, a game picker that sets what every table counts, then views. Every count opens the plays behind it. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#e3e8ee; --ink:#12161c; --muted:#5b6672; --line:#d3d9e0;
  --accent:#1f4fd1; --accent-ink:#ffffff; --make:#1b8a4c; --miss:#c2412d; --gold:#b98316;
  --board:#0b0f14; --board-ink:#e9edf2; --digit:#ffb547; --board-muted:#8a96a3;
  --court:#e6cc98; --court-line:#6e4f22; --paint:rgba(31,79,209,.16);
  --display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"Barlow",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1217; --surface:#171d25; --surface-2:#212934; --ink:#eef2f6; --muted:#93a0ad; --line:#2b3440;
  --accent:#6f9bff; --accent-ink:#0b1020; --make:#3fbf78; --miss:#f0715c; --gold:#e8b04a;
  --board:#05080b; --board-ink:#e9edf2; --digit:#ffb547; --board-muted:#8a96a3;
  --court:#3b2f1d; --court-line:#d8c39a; --paint:rgba(111,155,255,.18); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1217; --surface:#171d25; --surface-2:#212934; --ink:#eef2f6; --muted:#93a0ad; --line:#2b3440;
  --accent:#6f9bff; --accent-ink:#0b1020; --make:#3fbf78; --miss:#f0715c; --gold:#e8b04a;
  --board:#05080b; --board-ink:#e9edf2; --digit:#ffb547; --board-muted:#8a96a3;
  --court:#3b2f1d; --court-line:#d8c39a; --paint:rgba(111,155,255,.18); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--board)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1000px;margin:0 auto;width:100%}

/* season header */
.board{background:var(--board);color:var(--board-ink)}
.board .inner{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px;padding-block:16px 14px}
.team{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;letter-spacing:.02em;text-transform:uppercase}
.season{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--board-muted);margin-top:4px}
.rec{display:flex;gap:18px}
.rec div{display:flex;flex-direction:column;align-items:center}
.rec b{font-family:var(--display);font-weight:700;font-size:38px;line-height:1;color:var(--digit);font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(255,181,71,.25)}
.rec span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--board-muted)}

main{display:flex;flex-direction:column;gap:14px;padding-block:14px 40px}
.label{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}

/* game picker */
.games{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x proximity}
.gcard{flex:0 0 auto;scroll-snap-align:start;min-width:150px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:3px}
.gcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.gcard[aria-pressed="false"]{opacity:.55}
.gcard .opp{font-weight:700;white-space:nowrap}
.gcard .meta{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.gcard .score{font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.wl{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.06em;border-radius:3px;padding:1px 5px;color:var(--accent-ink)}
.wl.w{background:var(--make)}.wl.l{background:var(--miss)}.wl.t{background:var(--muted)}
.film{font-size:11px;font-weight:600;color:var(--gold)}
.tag{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.06em;border-radius:3px;padding:1px 5px;border:1px solid var(--line);color:var(--muted);text-transform:uppercase}
.gcard.scrimmage{border-style:dashed}
.empty.slim{padding:14px;text-align:left}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px;gap:2px}
.seg button{border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.views{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.views button{padding:10px 12px 9px;font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.views button[aria-current="page"]{color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}

/* tables */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px;width:100%}
th,td{padding:0;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-family:var(--display);font-weight:600;letter-spacing:.06em;font-size:13px;color:var(--muted);text-transform:uppercase;padding:8px 7px}
th.sort{cursor:pointer;user-select:none;-webkit-user-select:none}
th.sort.on{color:var(--accent)}
td>span,td>button{display:block;padding:8px 7px;width:100%;text-align:inherit}
td>button.n{color:var(--accent);font-weight:600}
td>button.n:hover{background:var(--surface-2)}
td>button.name{font-weight:600;text-align:left;color:var(--ink)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
td.lu>button{white-space:normal;min-width:180px;max-width:260px;line-height:1.3;font-size:13px}
tr.tot td{font-weight:700}
tr.opp td{color:var(--muted)}
tr:last-child td{border-bottom:0}
.pct{color:var(--muted);font-size:12px}
.hint{font-size:13px;color:var(--muted);line-height:1.45;max-width:66ch}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px;text-align:left}
.stat b{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.stat em{font-style:normal;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
select{font:inherit;font-size:15px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:7px 9px;color:var(--ink)}

/* court */
.courtwrap{max-width:460px;width:100%;margin:0 auto}
.courtsvg{display:block}
.courtsvg .floor{fill:var(--court)}.courtsvg .paint{fill:var(--paint)}
.courtsvg .cl{stroke:var(--court-line);stroke-width:0.25}
.courtsvg .rim{stroke:var(--miss);stroke-width:0.3}
.courtsvg .dot{stroke:var(--surface);stroke-width:0.3;fill:var(--make)}
.courtsvg .xmiss line{stroke:var(--miss);stroke-width:0.4;stroke-linecap:round}

/* plays sheet */
#sheetWrap{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:rgba(5,8,12,.5)}
.sheet{position:relative;background:var(--bg);border-radius:16px 16px 0 0;max-height:88%;overflow-y:auto;padding-block:16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-width:760px;width:100%;margin:0 auto}
.sheet h2{margin:0;font-family:var(--display);font-weight:700;font-size:26px;line-height:1.1;text-wrap:balance}
.sheet .sub{color:var(--muted);font-size:14px;margin-top:-6px}
.sheet .close{position:absolute;top:10px;right:max(12px,env(safe-area-inset-right,0px));font-size:15px;font-weight:600;color:var(--muted);padding:8px}
.gh{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.play{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.play .q{font-family:var(--display);font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.play .mk{color:var(--make);font-weight:600}.play .ms{color:var(--miss);font-weight:600}
.watch{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;text-decoration:none}
.watch.sm{padding:5px 10px;font-size:13px}
.nofilm{font-size:12px;color:var(--muted)}
@media (min-width:760px){.team{font-size:38px}}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto}}
</style>

<header class="board wrap"><div class="inner">
  <div><div class="team" id="h-team">Marcos Varsity</div><div class="season" id="h-season">2026–27 season</div></div>
  <div class="rec" id="h-rec"></div>
</div></header>
<div id="app" class="wrap"><main class="inner"><div class="empty"><b>Loading the season</b>Games appear here after each one is copied over from the stat book.</div></main></div>
<div id="sheetWrap" hidden><div class="scrim" data-act="close"></div><div class="sheet wrap" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STAT_TYPES = ["shot", "reb", "ast", "stl", "blk", "to", "foul"];
const pLabel = p => p <= 0 ? "PRE" : p <= 4 ? "Q" + p : (p === 5 ? "OT" : "OT" + (p - 4));
const numSort = (a, b) => (parseInt(a, 10) - parseInt(b, 10)) || String(a).localeCompare(String(b));
const signed = v => v == null ? "–" : (v > 0 ? "+" : "") + v;
const blank = () => ({ gp:0, pts:0, fgm:0, fga:0, tpm:0, tpa:0, ftm:0, fta:0, oreb:0, dreb:0, ast:0, stl:0, blk:0, to:0, pf:0, pm:0 });

/* ---------- data ---------- */
let GAMES = [];            // copied from the stat book by Claude after each game
let FILMS = {};            // gameId -> { site, film, clips:{eventId:[start,end]} } once a game's film is up
let ALIASES = {};          // old name (lowercase) -> current name, e.g. a nickname used in an early game
let state = "loading";
let pick = null;           // selected game ids
let mode = "tot";          // tot | avg
let tab = "players";
let shotTeam = "us", shotWho = "all";
const sortState = { players:{ k:null, d:0 }, lineups:{ k:null, d:0 }, games:{ k:null, d:0 } };
let sheetCtx = null;

try { const t = localStorage.getItem("hub/tab"); if (t) tab = t; } catch (e) {}

function canonical(name){ const n = String(name || "").trim(); return ALIASES[n.toLowerCase()] || n; }
// A player across games is their name (after aliases). Two players sharing a name in one game keep their number.
function rosterKeys(g){
  const count = {};
  g.roster.forEach(r => { const n = canonical(r.name).toLowerCase(); count[n] = (count[n] || 0) + 1; });
  const keys = {};
  const nums = g.roster.map(r => r.num).sort(numSort);
  g.roster.forEach(r => {
    const name = canonical(r.name);
    const dup = name && count[name.toLowerCase()] > 1 && nums.indexOf(r.num) > nums.findIndex(n => canonical((g.roster.find(x => x.num === n) || {}).name).toLowerCase() === name.toLowerCase());
    keys[r.num] = { key: (name || "#" + r.num).toLowerCase() + (dup ? "#" + r.num : ""), label: name ? name + (dup ? " #" + r.num : "") : "#" + r.num, num: r.num };
  });
  return keys;
}
function gameScore(g){
  let us = 0, them = 0;
  for (const e of g.events) if (e.type === "shot" && e.made) { if (e.team === "us") us += e.pts; else them += e.pts; }
  return { us, them };
}
function resultOf(g){ const s = gameScore(g); return s.us > s.them ? "w" : s.us < s.them ? "l" : "t"; }
function selected(){ return GAMES.filter(g => pick.has(g.id)); }
// A scrimmage stays in the hub to look back on, but never counts toward the season: it is viewed alone.
const isScrim = g => g.kind === "scrimmage";
const seasonGames = () => GAMES.filter(g => !isScrim(g));
const scrimGames = () => GAMES.filter(isScrim);
const byDate = arr => arr.slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));
const viewingScrim = () => selected().some(isScrim);

/* ---------- aggregation ---------- */
function aggregate(games){
  const P = {}, T = { us: blank(), them: blank() }, L = {};
  const playerInfo = {};
  for (const g of games) {
    const keys = rosterKeys(g);
    const seen = new Set();
    const pl = num => {
      const k = keys[num] || { key:"#" + num, label:"#" + num, num };
      playerInfo[k.key] = playerInfo[k.key] || { label:k.label, nums:new Set() };
      playerInfo[k.key].nums.add(num);
      seen.add(k.key);
      return P[k.key] || (P[k.key] = blank());
    };
    (g.starters || []).forEach(n => pl(n));
    T.us.gp++; T.them.gp++;
    let on = [...(g.starters || [])];
    for (const e of g.events) {
      if (e.type === "sub") { (e.in || []).forEach(n => pl(n)); on = on.filter(n => !(e.out || []).includes(n)).concat(e.in || []); continue; }
      if (!STAT_TYPES.includes(e.type)) continue;
      const floor = e.on || on;
      floor.forEach(n => pl(n));
      const side = T[e.team]; if (!side) continue;
      const p = e.team === "us" && e.player != null ? pl(e.player) : null;
      const lkey = floor.map(n => (keys[n] || { key:"#" + n }).key).sort().join("|");
      const lu = L[lkey] || (L[lkey] = { key:lkey, members: floor.map(n => (keys[n] || { label:"#" + n }).label), n:0, us:blank(), them:blank(), games:new Set() });
      lu.n++; lu.games.add(g.id);
      const inc = (k, v = 1) => { side[k] += v; if (p) p[k] += v; lu[e.team][k] += v; };
      if (e.type === "shot") {
        if (e.pts === 1) { inc("fta"); if (e.made) inc("ftm"); }
        else { inc("fga"); if (e.pts === 3) inc("tpa"); if (e.made) { inc("fgm"); if (e.pts === 3) inc("tpm"); } }
        if (e.made) {
          inc("pts", e.pts);
          floor.forEach(n => { pl(n).pm += e.team === "us" ? e.pts : -e.pts; });
        }
      } else if (e.type === "reb") inc(e.off ? "oreb" : "dreb");
      else if (e.type === "foul") inc("pf");
      else inc(e.type);
    }
    seen.forEach(k => P[k].gp++);
  }
  const players = Object.entries(P).map(([key, s]) => Object.assign({ key, label: playerInfo[key].label, nums:[...playerInfo[key].nums].sort(numSort) }, s));
  const lineups = Object.values(L).filter(l => l.members.length === 5).map(l => Object.assign(
    { key:l.key, label:l.members.slice().sort().join(" · "), n:l.n, games:l.games.size }, l.us, { opp:l.them.pts, pm:l.us.pts - l.them.pts }));
  return { players, T, lineups };
}

/* ---------- which plays a number is made of ---------- */
const STAT_PLAYS = {
  pts: e => e.type === "shot" && e.made,
  fg: e => e.type === "shot" && e.pts > 1,
  fgm: e => e.type === "shot" && e.pts > 1 && e.made,
  tp: e => e.type === "shot" && e.pts === 3,
  ft: e => e.type === "shot" && e.pts === 1,
  oreb: e => e.type === "reb" && e.off,
  dreb: e => e.type === "reb" && !e.off,
  reb: e => e.type === "reb",
  ast: e => e.type === "ast",
  stl: e => e.type === "stl",
  blk: e => e.type === "blk",
  to: e => e.type === "to",
  pf: e => e.type === "foul",
  all: e => STAT_TYPES.includes(e.type)
};
const STAT_NAMES = { pts:"points", fg:"field goal attempts", fgm:"made field goals", tp:"3-point attempts", ft:"free throws", oreb:"offensive rebounds", dreb:"defensive rebounds", reb:"rebounds", ast:"assists", stl:"steals", blk:"blocks", to:"turnovers", pf:"fouls", all:"plays" };
// who: {player:key} | {team:"us"|"them"} | {lineup:key}
function playsFor(who, stat){
  const out = [];
  for (const g of selected()) {
    const keys = rosterKeys(g);
    let on = [...(g.starters || [])];
    for (const e of g.events) {
      if (e.type === "sub") { on = on.filter(n => !(e.out || []).includes(n)).concat(e.in || []); continue; }
      if (!STAT_PLAYS[stat](e)) continue;
      if (who.player) { if (e.team !== "us" || e.player == null || (keys[e.player] || {}).key !== who.player) continue; }
      if (who.team && e.team !== who.team) continue;
      if (who.lineup) { const k = (e.on || on).map(n => (keys[n] || { key:"#" + n }).key).sort().join("|"); if (k !== who.lineup) continue; }
      out.push({ g, e, keys });
    }
  }
  return out;
}
function playText(x){
  const { g, e, keys } = x;
  const who = e.team === "them" ? (g.them || "Opponent") : e.player != null ? (keys[e.player] || { label:"#" + e.player }).label : (g.us || "Team");
  switch (e.type) {
    case "shot": return { who, what: (e.pts === 1 ? "free throw" : e.pts + "-pointer"), res: e.made ? "made" : "missed" };
    case "reb": return { who, what: e.off ? "offensive rebound" : "defensive rebound" };
    case "foul": return { who, what: e.kind === "offensive" ? "offensive foul" : e.kind === "shooting" ? "shooting foul" : "foul" };
    default: return { who, what: { ast:"assist", stl:"steal", blk:"block", to:"turnover" }[e.type] || e.type };
  }
}
function clipOf(x){ const f = FILMS[x.g.id]; return f && f.clips && f.clips[x.e.id] ? { site:f.site, film:f.film, t:f.clips[x.e.id] } : null; }
// The film player on the film site takes the clips in its address: #v1;<film>:<eventId>,<eventId>;<film>:...
function watchUrl(items){
  const byFilm = {}; let site = null;
  for (const x of items) { const c = clipOf(x); if (!c) continue; site = site || c.site; (byFilm[c.film] = byFilm[c.film] || []).push(x.e.id); }
  if (!site) return null;
  return site.replace(/\/$/, "") + "/watch#v1;" + Object.entries(byFilm).map(([f, ids]) => f + ":" + ids.join(",")).join(";");
}

/* ---------- tables ---------- */
const per = (r, k) => mode === "avg" && r.gp ? r[k] / r.gp : r[k];
const fmt = v => mode === "avg" ? (Math.round(v * 10) / 10).toFixed(1) : String(v);
const pct = (m, a) => a ? Math.round(100 * m / a) + "%" : "–";
function cell(r, k, text, stat){
  if (!stat || !r.who) return "<span>" + text + "</span>";
  return '<button class="n" data-act="plays" data-who="' + esc(JSON.stringify(r.who)) + '" data-stat="' + stat + '">' + text + "</button>";
}
const PCOLS = [
  { h:"Player", k:"label", f:r => r.who && r.who.player ? '<button class="name" data-act="player" data-key="' + esc(r.who.player) + '">' + esc(r.label) + "</button>" : "<span><b>" + esc(r.label) + "</b></span>" },
  { h:"GP", k:"gp", v:r => r.gp, f:r => "<span>" + r.gp + "</span>" },
  { h:"PTS", k:"pts", v:r => per(r, "pts"), f:r => cell(r, "pts", "<b>" + fmt(per(r, "pts")) + "</b>", "pts") },
  { h:"FG", k:"fg", v:r => r.fga ? r.fgm / r.fga + r.fga / 1e4 : null, f:r => cell(r, "fg", fmt(per(r, "fgm")) + "-" + fmt(per(r, "fga")) + ' <span class="pct">' + pct(r.fgm, r.fga) + "</span>", "fg") },
  { h:"3P", k:"tp", v:r => r.tpa ? r.tpm / r.tpa + r.tpa / 1e4 : null, f:r => cell(r, "tp", fmt(per(r, "tpm")) + "-" + fmt(per(r, "tpa")) + ' <span class="pct">' + pct(r.tpm, r.tpa) + "</span>", "tp") },

function sortRows(rows, cols, st){
  if (!st.k || !st.d) return rows;
  const col = cols.find(c => c.k === st.k); if (!col || !col.v) return rows;
  return rows.slice().sort((a, b) => {
    const x = col.v(a), y = col.v(b);
    if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
    return st.d === 1 ? x - y : y - x;
  });
}
function table(cols, rows, st, name, extra = ""){
  const head = "<tr>" + cols.map(c => {
    if (!c.v) return "<th>" + c.h + "</th>";
    const on = st.k === c.k && st.d;
    return '<th class="sort' + (on ? " on" : "") + '" data-act="sort" data-t="' + name + '" data-k="' + c.k + '" aria-sort="' + (on ? (st.d === 1 ? "ascending" : "descending") : "none") + '">' + c.h + (on ? (st.d === 1 ? " ▲" : " ▼") : "") + "</th>";
  }).join("") + "</tr>";
  const body = sortRows(rows, cols, st).map(r => "<tr>" + cols.map(c => "<td" + (name === "lineups" && c.k === "label" ? ' class="lu"' : "") + ">" + c.f(r) + "</td>").join("") + "</tr>").join("");
  return '<div class="scroll"><table>' + head + body + extra + "</table></div>";
}

/* ---------- views ---------- */
function header(){

  const ppg = arr => arr.length ? (arr.reduce((s, g) => s + gameScore(g).us, 0) / arr.length).toFixed(1) : "–";
  const opg = arr => arr.length ? (arr.reduce((s, g) => s + gameScore(g).them, 0) / arr.length).toFixed(1) : "–";
  $("#h-rec").innerHTML = "<div><b>" + w + "-" + l + "</b><span>Record</span></div><div><b>" + ppg(done) + "</b><span>Scored</span></div><div><b>" + opg(done) + "</b><span>Allowed</span></div>";

function picker(){

    (season.length ? '<div class="games">' + season.map(card).join("") + "</div>" : '<div class="empty slim"><b>The season starts with the first game</b>Each game shows up here after Claude copies it from the stat book.</div>') +

function viewPlayers(A){
  const rows = A.players.filter(r => r.gp > 0).map(r => Object.assign({ who:{ player:r.key } }, r));

  const tot = (side, label) => { const r = Object.assign({ label, team:true, who:{ team:side } }, A.T[side]); return '<tr class="tot' + (side === "them" ? " opp" : "") + '">' + PCOLS.map(c => "<td>" + c.f(r) + "</td>").join("") + "</tr>"; };

function viewTeam(A){

  const pp = s => poss(s) ? (s.pts / poss(s)).toFixed(2) : "–";

let minPlays = 10;

const RIM = { x:25, y:5.25 }, ARC = 19.75;

  const line = x => "<tr><td><span>" + esc(x.g.date) + "</span></td><td><span>" + esc(x.g.them) + "</span></td><td><span><b>" + x.r.pts + "</b></span></td><td><span>" + x.r.fgm + "-" + x.r.fga + "</span></td><td><span>" + x.r.tpm + "-" + x.r.tpa + "</span></td><td><span>" + x.r.ftm + "-" + x.r.fta + "</span></td><td><span>" + (x.r.oreb + x.r.dreb) + "</span></td><td><span>" + x.r.ast + "</span></td><td><span>" + x.r.stl + "</span></td><td><span>" + x.r.to + "</span></td><td><span>" + signed(x.r.pm) + "</span></td></tr>";
  const shots = [];
  for (const g of games) { const keys = rosterKeys(g); for (const e of g.events) if (e.type === "shot" && e.pts > 1 && e.x != null && e.team === "us" && (keys[e.player] || {}).key === key) shots.push(e); }
  const stats = ["pts", "fgm", "tp", "reb", "ast", "stl", "to"].map(s => '<button class="chip" data-act="plays" data-who="' + esc(JSON.stringify({ player:key })) + '" data-stat="' + s + '">' + STAT_NAMES[s][0].toUpperCase() + STAT_NAMES[s].slice(1) + "</button>").join("");
  openSheet("<h2>" + esc(label) + '</h2><div class="sub">' + rows.length + " game" + (rows.length === 1 ? "" : "s") + " counted</div>" +
    '<div class="row">' + stats + "</div>" +
    '<div class="scroll"><table><tr><th>Date</th><th>Opp</th><th>PTS</th><th>FG</th><th>3P</th><th>FT</th><th>REB</th><th>AST</th><th>STL</th><th>TO</th><th>+/-</th></tr>' + rows.map(line).join("") + "</table></div>" +
    (shots.length ? '<div class="courtwrap">' + courtSvg(shots.map(mark).join("")) + '</div><div class="hint">' + shots.filter(e => e.made).length + " of " + shots.length + " marked field goals made.</div>" : ""));
}

/* ---------- events ---------- */
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "close") return closeSheet();
  if (act === "toggle") {
    const g = GAMES.find(x => x.id === b.dataset.id); if (!g) return;
    if (isScrim(g)) pick = pick.has(g.id) && pick.size === 1 ? new Set(seasonGames().map(x => x.id)) : new Set([g.id]);
    else if (viewingScrim()) pick = new Set([g.id]);
    else pick.has(g.id) ? pick.delete(g.id) : pick.add(g.id);
    render(); return;
  }
  if (act === "only") { pick = new Set([b.dataset.id]); tab = "players"; render(); window.scrollTo(0, 0); return; }
  if (act === "quick") {
    const sorted = byDate(seasonGames());
    pick = new Set(b.dataset.v === "last3" ? sorted.slice(0, 3).map(g => g.id) : sorted.map(g => g.id)); render(); return;
  }
  if (act === "tab") { tab = b.dataset.v; try { localStorage.setItem("hub/tab", tab); } catch (e) {} render(); return; }
  if (act === "mode") { mode = b.dataset.v; render(); return; }
  if (act === "shotteam") { shotTeam = b.dataset.v; render(); return; }
  if (act === "sort") { const st = sortState[b.dataset.t], k = b.dataset.k; if (st.k !== k) { st.k = k; st.d = 1; } else st.d = (st.d + 1) % 3; render(); return; }
  if (act === "plays") { sheetPlays(JSON.parse(b.dataset.who), b.dataset.stat); return; }
  if (act === "player") { sheetPlayer(b.dataset.key); return; }
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && !$("#sheetWrap").hidden) closeSheet(); });

/* ---------- load ---------- */
async function load(){
  render();
  const timer = setTimeout(() => { if (state === "loading") { state = "error"; $("#app").innerHTML = '<main class="inner"><div class="empty"><b>The season did not load</b>Close the page and open it again. If it keeps happening, tell Claude.</div></main>'; } }, 10000);
  try {
    const db = window.claude && await window.claude.use("db");
    if (!db) { clearTimeout(timer); state = "error"; $("#app").innerHTML = '<main class="inner"><div class="empty"><b>Sign in to see the season</b>The games are kept with this page on claude.ai.</div></main>'; return; }
    const [gs, fs, meta] = await Promise.all([
      db.collection("games").get(),
      db.collection("films").get().catch(() => null),
      db.doc("meta/players").get().catch(() => null)
    ]);
    clearTimeout(timer);
    GAMES = gs.docs.map(d => d.data()).filter(g => g && Array.isArray(g.events));
    FILMS = {}; if (fs) fs.docs.forEach(d => { FILMS[d.id] = d.data(); });
    const m = meta && meta.exists ? meta.data() : null;
    ALIASES = {}; if (m && m.aliases) Object.entries(m.aliases).forEach(([k, v]) => { ALIASES[k.toLowerCase()] = v; });
    state = "ready";
    render();
  } catch (e) {
    clearTimeout(timer); state = "error";
    $("#app").innerHTML = '<main class="inner"><div class="empty"><b>The season did not load</b>' + esc(e && e.message || e) + "</div></main>";
  }
}
load();
})();
</script>
