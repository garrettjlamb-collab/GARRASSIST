<title>Padres Season Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: the stat book's scoreboard band as a season header, a game picker that sets what every table counts, then views. Every count opens the plays behind it. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#e3e8ee; --ink:#12161c; --muted:#5b6672; --line:#d3d9e0;
  --accent:#1f4fd1; --accent-ink:#ffffff; --make:#1b8a4c; --miss:#c2412d; --gold:#b98316;
  --board:#0b0f14; --board-ink:#e9edf2; --digit:#ffb547; --board-muted:#8a96a3;
  --court:#e6cc98; --court-line:#6e4f22; --paint:rgba(31,79,209,.16);
  --display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"Barlow",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1217; --surface:#171d25; --surface-2:#212934; --ink:#eef2f6; --muted:#93a0ad; --line:#2b3440;
  --accent:#6f9bff; --accent-ink:#0b1020; --make:#3fbf78; --miss:#f0715c; --gold:#e8b04a;
  --board:#05080b; --board-ink:#e9edf2; --digit:#ffb547; --board-muted:#8a96a3;
  --court:#3b2f1d; --court-line:#d8c39a; --paint:rgba(111,155,255,.18); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1217; --surface:#171d25; --surface-2:#212934; --ink:#eef2f6; --muted:#93a0ad; --line:#2b3440;
  --accent:#6f9bff; --accent-ink:#0b1020; --make:#3fbf78; --miss:#f0715c; --gold:#e8b04a;
  --board:#05080b; --board-ink:#e9edf2; --digit:#ffb547; --board-muted:#8a96a3;
  --court:#3b2f1d; --court-line:#d8c39a; --paint:rgba(111,155,255,.18); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--board)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1000px;margin:0 auto;width:100%}

/* season header */
.board{background:var(--board);color:var(--board-ink)}
.board .inner{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px;padding-block:16px 14px}
.team{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;letter-spacing:.02em;text-transform:uppercase}
.season{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--board-muted);margin-top:4px}
.rec{display:flex;gap:18px}
.rec div{display:flex;flex-direction:column;align-items:center}
.rec b{font-family:var(--display);font-weight:700;font-size:38px;line-height:1;color:var(--digit);font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(255,181,71,.25)}
.rec span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--board-muted)}

main{display:flex;flex-direction:column;gap:14px;padding-block:14px 40px}
.label{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}

/* game picker */
.games{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x proximity}
.gcard{flex:0 0 auto;scroll-snap-align:start;min-width:150px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:3px}
.gcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.gcard[aria-pressed="false"]{opacity:.55}
.gcard .opp{font-weight:700;white-space:nowrap}
.gcard .meta{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.gcard .score{font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.wl{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.06em;border-radius:3px;padding:1px 5px;color:var(--accent-ink)}
.wl.w{background:var(--make)}.wl.l{background:var(--miss)}.wl.t{background:var(--muted)}
.film{font-size:11px;font-weight:600;color:var(--gold)}
.tag{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.06em;border-radius:3px;padding:1px 5px;border:1px solid var(--line);color:var(--muted);text-transform:uppercase}
.gcard.scrimmage{border-style:dashed}
.empty.slim{padding:14px;text-align:left}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px;gap:2px}
.seg button{border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.views{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.views button{padding:10px 12px 9px;font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.views button[aria-current="page"]{color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}

/* tables */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px;width:100%}
th,td{padding:0;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-family:var(--display);font-weight:600;letter-spacing:.06em;font-size:13px;color:var(--muted);text-transform:uppercase;padding:8px 7px}
th.sort{cursor:pointer;user-select:none;-webkit-user-select:none}
th.sort.on{color:var(--accent)}
td>span,td>button{display:block;padding:8px 7px;width:100%;text-align:inherit}
td>button.n{color:var(--accent);font-weight:600}
td>button.n:hover{background:var(--surface-2)}
td>button.name{font-weight:600;text-align:left;color:var(--ink)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
td.lu>button{white-space:normal;min-width:180px;max-width:260px;line-height:1.3;font-size:13px}
tr.tot td{font-weight:700}
tr.opp td{color:var(--muted)}
tr:last-child td{border-bottom:0}
.pct{color:var(--muted);font-size:12px}
.hint{font-size:13px;color:var(--muted);line-height:1.45;max-width:66ch}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px;text-align:left}
.stat b{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.stat em{font-style:normal;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
select{font:inherit;font-size:15px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:7px 9px;color:var(--ink)}

/* court */
.courtwrap{max-width:460px;width:100%;margin:0 auto}
.courtsvg{display:block}
.courtsvg .floor{fill:var(--court)}.courtsvg .paint{fill:var(--paint)}
.courtsvg .cl{stroke:var(--court-line);stroke-width:0.25}
.courtsvg .rim{stroke:var(--miss);stroke-width:0.3}
.courtsvg .dot{stroke:var(--surface);stroke-width:0.3;fill:var(--make)}
.courtsvg .xmiss line{stroke:var(--miss);stroke-width:0.4;stroke-linecap:round}

/* plays sheet */
#sheetWrap{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:16px}
.scrim{position:absolute;inset:0;background:rgba(5,8,12,.5)}
/* the plays pop-up sits in the middle of the screen; a long list scrolls inside it */
.sheet{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:16px;max-height:min(80dvh,820px);overflow-y:auto;overscroll-behavior:contain;padding-block:16px 18px;display:flex;flex-direction:column;gap:12px;max-width:760px;width:100%;box-shadow:0 18px 48px rgba(0,0,0,.35)}
.sheet h2{margin:0;font-family:var(--display);font-weight:700;font-size:26px;line-height:1.1;text-wrap:balance}
.sheet .sub{color:var(--muted);font-size:14px;margin-top:-6px}
.sheet .close{position:absolute;top:10px;right:max(12px,env(safe-area-inset-right,0px));font-size:15px;font-weight:600;color:var(--muted);padding:8px}
.gh{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.play{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.play .q{font-family:var(--display);font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.play .mk{color:var(--make);font-weight:600}.play .ms{color:var(--miss);font-weight:600}
.watch{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;text-decoration:none}
.watch.sm{padding:5px 10px;font-size:13px}
.nofilm{font-size:12px;color:var(--muted)}
/* chart colors: us = series 1 (blue), them = series 2 (orange), margins blue/red around gray; heat = one blue ramp */
:root{--s1:#2a78d6;--s2:#eb6834;--neg:#e34948;--grid:#e3e1dc;--ring:var(--surface)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#d95926;--neg:#e66767;--grid:#2b3440}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--neg:#e66767;--grid:#2b3440}

/* report */
.rhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.rscore{display:flex;align-items:baseline;gap:10px;font-family:var(--display);font-weight:700}
.rscore b{font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.rscore span{font-size:18px;color:var(--muted);letter-spacing:.04em}
.sec{font-family:var(--display);font-weight:700;font-size:21px;margin:10px 0 -4px}
.qt td>span,.qt th{text-align:center}
.qt tr.best td{background:var(--surface-2)}
.callouts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.callout{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:3px}
.callout .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--display);font-weight:600}
.callout b{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.callout span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.callout.them{border-left:4px solid var(--s2)}.callout.us{border-left:4px solid var(--s1)}

/* heat map */
.heat .z{stroke:none}
.heat .zl{font-family:var(--display);font-weight:700;text-anchor:middle;pointer-events:none}
.heat .zl.c{font-size:1.55px}.heat .zl.p{font-size:1.2px;font-weight:600}
.heat [data-act="zone"]{cursor:pointer}
.ramp{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.ramp i{display:inline-block;width:22px;height:10px;border-radius:2px}

/* trends */
.trends{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.trend{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;position:relative}
.trend h3{margin:0 0 4px;font-family:var(--display);font-weight:700;font-size:18px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-bottom:4px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.trend svg{display:block;overflow:visible}
.trend .gl{stroke:var(--grid);stroke-width:1}
.trend .ax{font-size:10px;fill:var(--muted);font-family:var(--body)}
.trend .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.trend .dt{stroke:var(--ring);stroke-width:2}
.trend .hit{fill:transparent;cursor:pointer}
.trend .hit.on{fill:var(--surface-2)}
.trend svg :not(.hit){pointer-events:none}
.tip{position:absolute;z-index:3;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.4;padding:6px 8px;border-radius:6px;pointer-events:none;white-space:nowrap;font-variant-numeric:tabular-nums}
@media (min-width:760px){.team{font-size:38px}}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto}}
</style>

<header class="board wrap"><div class="inner">
  <div><div class="team" id="h-team">Marcos Varsity</div><div class="season" id="h-season">2026–27 season</div></div>
  <div class="rec" id="h-rec"></div>
</div></header>
<div id="app" class="wrap"><main class="inner"><div class="empty"><b>Loading the season</b>Games appear here after each one is copied over from the stat book.</div></main></div>
<div id="sheetWrap" hidden><div class="scrim" data-act="close"></div><div class="sheet wrap" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STAT_TYPES = ["shot", "reb", "ast", "stl", "blk", "to", "foul"];
const pLabel = p => p <= 0 ? "PRE" : p <= 4 ? "Q" + p : (p === 5 ? "OT" : "OT" + (p - 4));
const numSort = (a, b) => (parseInt(a, 10) - parseInt(b, 10)) || String(a).localeCompare(String(b));
const signed = v => v == null ? "–" : (v > 0 ? "+" : "") + v;
const blank = () => ({ gp:0, pts:0, fgm:0, fga:0, tpm:0, tpa:0, ftm:0, fta:0, oreb:0, dreb:0, ast:0, stl:0, blk:0, to:0, pf:0, pm:0 });

/* ---------- data ---------- */
let GAMES = [];            // copied from the stat book by Claude after each game
let FILMS = {};            // gameId -> { site, film, clips:{eventId:[start,end]} } once a game's film is up
let ALIASES = {};          // old name (lowercase) -> current name, e.g. a nickname used in an early game
let state = "loading";
let pick = null;           // selected game ids
let mode = "tot";          // tot | avg
let tab = "report";
let shotTeam = "us", shotWho = "all", shotView = "heat";
const sortState = { players:{ k:null, d:0 }, lineups:{ k:null, d:0 }, games:{ k:null, d:0 } };
let sheetCtx = null;

try { const t = localStorage.getItem("hub/tab"); if (t) tab = t; } catch (e) {}

function canonical(name){ const n = String(name || "").trim(); return ALIASES[n.toLowerCase()] || n; }
// A player across games is their name (after aliases). Two players sharing a name in one game keep their number.
function rosterKeys(g){
  const count = {};
  g.roster.forEach(r => { const n = canonical(r.name).toLowerCase(); count[n] = (count[n] || 0) + 1; });
  const keys = {};
  const nums = g.roster.map(r => r.num).sort(numSort);
  g.roster.forEach(r => {
    const name = canonical(r.name);
    const dup = name && count[name.toLowerCase()] > 1 && nums.indexOf(r.num) > nums.findIndex(n => canonical((g.roster.find(x => x.num === n) || {}).name).toLowerCase() === name.toLowerCase());
    keys[r.num] = { key: (name || "#" + r.num).toLowerCase() + (dup ? "#" + r.num : ""), label: name ? name + (dup ? " #" + r.num : "") : "#" + r.num, num: r.num };
  });
  return keys;
}
function gameScore(g){
  let us = 0, them = 0;
  for (const e of g.events) if (e.type === "shot" && e.made) { if (e.team === "us") us += e.pts; else them += e.pts; }
  return { us, them };
}
function resultOf(g){ const s = gameScore(g); return s.us > s.them ? "w" : s.us < s.them ? "l" : "t"; }
function selected(){ return GAMES.filter(g => pick.has(g.id)); }
// A scrimmage stays in the hub to look back on, but never counts toward the season: it is viewed alone.
const isScrim = g => g.kind === "scrimmage";
const seasonGames = () => GAMES.filter(g => !isScrim(g));
const scrimGames = () => GAMES.filter(isScrim);
const byDate = arr => arr.slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));
const viewingScrim = () => selected().some(isScrim);

/* ---------- aggregation ---------- */
// Possessions, estimated from the box: shots, offensive rebounds, turnovers and free-throw trips
const poss = s => s.fga - s.oreb + s.to + 0.44 * s.fta;
const ppp = (pts, s) => { const p = poss(s); return p >= 1 ? pts / p : null; };
const fmtPpp = v => v == null ? "–" : v.toFixed(2);
const netOf = r => { const o = ppp(r.pts, r), d = ppp(r.opp, r.themS); return o == null || d == null ? null : o - d; };
function aggregate(games, inPer){
  const P = {}, T = { us: blank(), them: blank() }, L = {};
  const playerInfo = {};
  for (const g of games) {
    const keys = rosterKeys(g);
    const seen = new Set();
    const pl = num => {
      const k = keys[num] || { key:"#" + num, label:"#" + num, num };
      playerInfo[k.key] = playerInfo[k.key] || { label:k.label, nums:new Set() };
      playerInfo[k.key].nums.add(num);
      seen.add(k.key);
      return P[k.key] || (P[k.key] = blank());
    };
    (g.starters || []).forEach(n => pl(n));
    T.us.gp++; T.them.gp++;
    let on = [...(g.starters || [])];
    for (const e of g.events) {
      if (e.type === "sub") { (e.in || []).forEach(n => pl(n)); on = on.filter(n => !(e.out || []).includes(n)).concat(e.in || []); continue; }
      if (!STAT_TYPES.includes(e.type)) continue;
      if (inPer && !inPer(e.p)) continue;
      const floor = e.on || on;
      floor.forEach(n => pl(n));
      const side = T[e.team]; if (!side) continue;
      const p = e.team === "us" && e.player != null ? pl(e.player) : null;
      const lkey = floor.map(n => (keys[n] || { key:"#" + n }).key).sort().join("|");
      const lu = L[lkey] || (L[lkey] = { key:lkey, members: floor.map(n => (keys[n] || { label:"#" + n }).label), n:0, us:blank(), them:blank(), games:new Set() });
      lu.n++; lu.games.add(g.id);
      const inc = (k, v = 1) => { side[k] += v; if (p) p[k] += v; lu[e.team][k] += v; };
      if (e.type === "shot") {
        if (e.pts === 1) { inc("fta"); if (e.made) inc("ftm"); }
        else { inc("fga"); if (e.pts === 3) inc("tpa"); if (e.made) { inc("fgm"); if (e.pts === 3) inc("tpm"); } }
        if (e.made) {
          inc("pts", e.pts);
          floor.forEach(n => { pl(n).pm += e.team === "us" ? e.pts : -e.pts; });
        }
      } else if (e.type === "reb") inc(e.off ? "oreb" : "dreb");
      else if (e.type === "foul") inc("pf");
      else inc(e.type);
    }
    seen.forEach(k => P[k].gp++);
  }
  const players = Object.entries(P).map(([key, s]) => Object.assign({ key, label: playerInfo[key].label, nums:[...playerInfo[key].nums].sort(numSort) }, s));
  const lineups = Object.values(L).filter(l => l.members.length === 5).map(l => Object.assign(
    { key:l.key, label:l.members.slice().sort().join(" · "), n:l.n, games:l.games.size, gameIds:[...l.games] }, l.us,
    { opp:l.them.pts, pm:l.us.pts - l.them.pts, themS:l.them, poss:(poss(l.us) + poss(l.them)) / 2 }));
  return { players, T, lineups };
}

/* ---------- which plays a number is made of ---------- */
const STAT_PLAYS = {
  pts: e => e.type === "shot" && e.made,
  fg: e => e.type === "shot" && e.pts > 1,
  fgm: e => e.type === "shot" && e.pts > 1 && e.made,
  tp: e => e.type === "shot" && e.pts === 3,
  ft: e => e.type === "shot" && e.pts === 1,
  oreb: e => e.type === "reb" && e.off,
  dreb: e => e.type === "reb" && !e.off,
  reb: e => e.type === "reb",
  ast: e => e.type === "ast",
  stl: e => e.type === "stl",
  blk: e => e.type === "blk",
  to: e => e.type === "to",

/* ---------- shot zones and the heat map ---------- */

  { k:"top3", name:"Top of the key 3", lx:25, ly:30.7 },

    '<clipPath id="' + id + 'T"><rect x="19" y="0" width="12" height="40"/></clipPath>' +
    '<clipPath id="' + id + 'R"><rect x="31" y="0" width="19" height="40"/></clipPath>' +
    '<clipPath id="' + id + 'C"><rect x="0" y="0" width="50" height="40"/></clipPath></defs>' +
    zone("lc", '<rect x="0" y="0" width="19" height="10"/>') + zone("lw", '<rect x="0" y="10" width="19" height="30"/>') +

/* ---------- runs, quarters, leaders ---------- */
function scoringPlays(g){
  const out = []; let us = 0, them = 0;

    if (e.type !== "shot" || !e.made) continue;
    const before = [us, them];

// The most points `side` scored while the other team scored no more than `allow`. Starts and ends on a `side`

function bestRun(sp, side, allow){
  let best = null;
  for (let i = 0; i < sp.length; i++) {
    if (sp[i].team !== side) continue;
    let mine = 0, theirs = 0;
    for (let j = i; j < sp.length; j++) {
      if (sp[j].team !== side) { theirs += sp[j].pts; if (theirs > allow) break; continue; }
      mine += sp[j].pts;
      if (!best || mine > best.mine || (mine === best.mine && theirs < best.theirs)) best = { i, j, mine, theirs };
    }
  }

}

/* ---------- minutes: who was on the floor, by the time of day the stat book stamped ---------- */
// Each quarter's real length (whistle to whistle, as logged) is spread evenly over its game minutes, so game
// minutes are an estimate: a stretch full of fouls and timeouts reads a little long. Real times are exact to the tap.
function periodSpans(g){
  const P = {};
  for (const e of g.events) if (e.type === "period" && e.ms && e.period) { const d = P[e.period] || (P[e.period] = {}); d[e.action] = e.ms; }
  const fin = (g.events.find(e => e.type === "final") || {}).ms;
  const last = g.events.reduce((m, e) => Math.max(m, e.ms || 0), 0);
  const ps = Object.keys(P).map(Number).sort((a, b) => a - b);
  ps.forEach((p, i) => { if (!P[p].end) P[p].end = (P[ps[i + 1]] || {}).start || fin || last; });
  return ps.filter(p => P[p].start && P[p].end > P[p].start).map(p => ({ p, start:P[p].start, end:P[p].end, len:(p <= 4 ? (g.qlen || 8) : 4) * 60 }));

    if (ms <= s.start) return off;
    if (ms < s.end) return off + (ms - s.start) / (s.end - s.start) * s.len;
    off += s.len;
  }
  return off;
}

  const on = {}, out = {};
  (g.starters || []).forEach(n => on[n] = start);
  for (const e of g.events) {
    if (e.type !== "sub" || !e.ms) continue;
    (e.out || []).forEach(n => { if (on[n] != null) { (out[n] = out[n] || []).push([on[n], e.ms]); delete on[n]; } });
    (e.in || []).forEach(n => { if (on[n] == null) on[n] = e.ms; });
  }
  Object.entries(on).forEach(([n, a]) => (out[n] = out[n] || []).push([a, end]));
  const keys = rosterKeys(g);
  const players = Object.entries(out).map(([num, ons]) => {
    ons.sort((a, b) => a[0] - b[0]);
    const segs = []; let cur = start;
    ons.forEach(([a, b]) => { if (a > cur) segs.push({ on:false, a:cur, b:a }); segs.push({ on:true, a, b }); cur = b; });
    if (cur < end) segs.push({ on:false, a:cur, b:end });
    segs.forEach(s => { s.ga = gameAt(spans, s.a); s.gb = gameAt(spans, s.b); s.game = s.gb - s.ga; });

    return { num, key:k.key, label:k.label, segs, mins:segs.filter(s => s.on).reduce((t, s) => t + s.game, 0) / 60 };

}

    '<div class="scroll"><table><tr><th>Player</th><th>Est. min</th><th>Stints</th><th>Longest out</th></tr>' + rows + "</table></div>" +

  const hiQ = qs.length ? qs.slice().sort((a, b) => b.us - a.us)[0] : null;
  const qt = '<div class="scroll"><table class="qt"><tr><th>Quarter</th><th>Us</th><th>' + esc(g.them) + "</th><th>Margin</th></tr>" +
    qs.map(q => '<tr' + (q === bq ? ' class="best"' : "") + "><td><span>" + pLabel(q.p) + (q === bq ? " · best" : "") + "</span></td><td><span><b>" + q.us + "</b></span></td><td><span>" + q.them + "</span></td><td><span>" + signed(q.us - q.them) + "</span></td></tr>").join("") +
    "<tr class=\"tot\"><td><span>Game</span></td><td><span>" + s.us + "</span></td><td><span>" + s.them + "</span></td><td><span>" + signed(s.us - s.them) + "</span></td></tr></table></div>" +
    (bq ? '<div class="hint">Best quarter by margin: ' + pLabel(bq.p) + " (" + bq.us + "–" + bq.them + "). Most points: " + pLabel(hiQ.p) + " (" + hiQ.us + ").</div>" : "");

  // runs
  const sp = scoringPlays(g);
  const run = (side, allow) => {
    const r = bestRun(sp, side, allow); const name = side === "us" ? "Our" : esc(g.them) + "'s";
    const title = allow ? name + " best stretch, " + (side === "us" ? "them" : "us") + " held to " + allow + " or fewer" : name + " biggest run";
    if (!r) return callout(title, "–", "No baskets", "", side === "us" ? "us" : "them");
    return callout(title, r.mine + "–" + r.theirs, runSpan(sp, r), ' data-act="run" data-g="' + esc(gid) + '" data-side="' + side + '" data-allow="' + allow + '"', side === "us" ? "us" : "them");
  };
  const runs = '<div class="callouts">' + run("us", 0) + run("us", RUN_ALLOW) + run("them", 0) + run("them", RUN_ALLOW) + "</div>" +
    '<div class="hint">A run counts every basket and free throw in order. Score shown is ours first. Tap a run for its plays.</div>';

  // efficiency
  const eff = '<div class="callouts">' +
    callout("Points per possession", fmtPpp(ppp(u.pts, u)), "Them " + fmtPpp(ppp(t.pts, t))) +
    callout("Field goals", pct(u.fgm, u.fga), u.fgm + " of " + u.fga + " · them " + pct(t.fgm, t.fga), ' data-act="plays" data-who=\'{"team":"us"}\' data-stat="fg" data-g="' + esc(gid) + '"') +
    callout("Threes", pct(u.tpm, u.tpa), u.tpm + " of " + u.tpa + " · them " + t.tpm + " of " + t.tpa, ' data-act="plays" data-who=\'{"team":"us"}\' data-stat="tp" data-g="' + esc(gid) + '"') +
    callout("Free throws", pct(u.ftm, u.fta), u.ftm + " of " + u.fta + " · them " + t.ftm + " of " + t.fta, ' data-act="plays" data-who=\'{"team":"us"}\' data-stat="ft" data-g="' + esc(gid) + '"') +
    callout("Rebounds", u.oreb + u.dreb, u.oreb + " offensive · them " + (t.oreb + t.dreb), ' data-act="plays" data-who=\'{"team":"us"}\' data-stat="reb" data-g="' + esc(gid) + '"') +
    callout("Turnovers", u.to, "Forced " + t.to, ' data-act="plays" data-who=\'{"team":"us"}\' data-stat="to" data-g="' + esc(gid) + '"') + "</div>";

  // lineups: the best and worst fives by margin, with efficiency
  const minN = 8;
  const lus = A.lineups.filter(l => l.n >= minN).sort((a, b) => b.pm - a.pm || b.n - a.n);
  const pickL = lus.length <= 6 ? lus : lus.slice(0, 3).concat(lus.slice(-3));
  const lrow = l => "<tr><td class=\"lu\">" + playsBtn(esc(l.label), { lineup:l.key }, "all", gid, "name") + "</td><td><span>" + l.n + "</span></td><td><span>" + l.pts + "–" + l.opp + "</span></td><td><span><b>" + signed(l.pm) + "</b></span></td><td><span>" + fmtPpp(ppp(l.pts, l)) + "</span></td><td><span>" + fmtPpp(ppp(l.opp, l.themS)) + "</span></td></tr>";
  const lineups = lus.length ? '<div class="scroll"><table><tr><th>Lineup</th><th>Plays</th><th>Score</th><th>+/-</th><th>Off</th><th>Def</th></tr>' +
    (lus.length <= 6 ? pickL.map(lrow).join("") : pickL.slice(0, 3).map(lrow).join("") + '<tr><td colspan="6"><span class="hint">…</span></td></tr>' + pickL.slice(3).map(lrow).join("")) + "</table></div>" +
    '<div class="hint">Fives with ' + minN + "+ plays logged, best margin first" + (lus.length > 6 ? "; the three best and three worst of " + lus.length : "") + ". Off and Def are points per possession for and against. Every five is on the Lineups tab.</div>"
    : '<div class="empty slim">No five was on the floor for ' + minN + "+ plays.</div>";

  // shots
  const shots = spottedShots([g], "all");
  const ctx = { g:[gid], who:"all" };
  const heat = shots.length ? heatMap(shots.map(x => x.e), ctx) + zoneTable(shots.map(x => x.e), ctx) : '<div class="empty slim">No shot spots were marked in this game.</div>';

  return head + '<div class="sec">Leaders</div>' + leaders + '<div class="sec">By quarter</div>' + qt + '<div class="sec">Runs</div>' + runs +
    '<div class="sec">Shooting and efficiency</div>' + eff + '<div class="sec">Minutes</div>' + minutesSection(g) +
    '<div class="sec">Lineups</div>' + lineups + '<div class="sec">Where our shots came from</div>' + heat;
}

/* ---------- trends: game by game ---------- */
function niceStep(span){ const raw = span / 3, mag = Math.pow(10, Math.floor(Math.log10(raw || 1))); const n = raw / mag; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag; }
const shortOpp = g => String(g.them || "").split(/\s+/)[0].slice(0, 9);
function chartFrame(title, legend, body){
  return '<div class="trend"><h3>' + title + "</h3>" + (legend ? '<div class="legend">' + legend + "</div>" : "") + body + "</div>";
}
const legendItem = (name, color) => '<span><i style="background:' + color + '"></i>' + esc(name) + "</span>";
function lineChart(title, series, rows, fv, opt = {}){
  const W = 320, H = 150, L = 34, R = 34, T = 10, B = 22, n = rows.length;
  const xs = i => n === 1 ? L + (W - L - R) / 2 : L + i * (W - L - R) / (n - 1);
  const vals = series.flatMap(s => rows.map(s.v)).filter(v => v != null);
  if (!vals.length) return chartFrame(title, "", '<div class="hint">Nothing to show yet.</div>');
  let lo = opt.min != null ? opt.min : Math.min(0, ...vals), hi = Math.max(...vals, lo + 1);
  const step = niceStep(hi - lo); hi = Math.ceil(hi / step) * step; lo = Math.floor(lo / step) * step;
  const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  let svg = "";
  for (let v = lo; v <= hi + 1e-9; v += step) svg += '<line class="gl" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="ax" x="' + (L - 6) + '" y="' + (y(v) + 3) + '" text-anchor="end">' + (opt.axis ? opt.axis(v) : v) + "</text>";
  const every = Math.ceil(n / 7);
  rows.forEach((r, i) => { if (i % every === 0 || i === n - 1) svg += '<text class="ax" x="' + xs(i) + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(shortOpp(r.g)) + "</text>"; });
  const ends = [];
  series.forEach(s => {
    let d = "", pen = false;
    rows.forEach((r, i) => { const v = s.v(r); if (v == null) { pen = false; return; } d += (pen ? "L" : "M") + xs(i) + " " + y(v); pen = true; });
    if (n > 1) svg += '<path class="ln" d="' + d + '" style="stroke:' + s.c + '"/>';
    rows.forEach((r, i) => { const v = s.v(r); if (v != null) svg += '<circle class="dt" cx="' + xs(i) + '" cy="' + y(v) + '" r="4" style="fill:' + s.c + '"/>'; });
    const li = rows.map(s.v).map((v, i) => v == null ? -1 : i).filter(i => i >= 0).pop();
    if (li != null) ends.push({ y:y(s.v(rows[li])), x:xs(li), name:s.name });
  });
  ends.sort((a, b) => a.y - b.y);
  for (let k = 1; k < ends.length; k++) if (ends[k].y - ends[k - 1].y < 11) ends[k].y = ends[k - 1].y + 11;
  ends.forEach(e => { svg += '<text class="ax" x="' + (e.x + 8) + '" y="' + (e.y + 3) + '" style="fill:var(--ink)">' + esc(e.name) + "</text>"; });
  const half = n === 1 ? (W - L - R) / 2 : (W - L - R) / (n - 1) / 2;
  let hits = "";
  rows.forEach((r, i) => {
    const tip = "<b>" + esc(r.g.date) + " vs " + esc(r.g.them) + "</b><br>" + series.map(s => esc(s.name) + " " + (s.v(r) == null ? "–" : fv(s.v(r)))).join(" · ");
    hits += '<rect class="hit" x="' + (xs(i) - half) + '" y="' + T + '" width="' + (2 * half) + '" height="' + (H - T - B) + '" data-tip="' + esc(tip) + '"/>';
  });
  svg = hits + svg;
  return chartFrame(title, opt.legend || (series.length > 1 ? series.map(s => legendItem(s.name, s.c)).join("") : ""),
    '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" role="img" aria-label="' + esc(title) + ', game by game">' + svg + "</svg>");
}
function marginChart(rows){
  const W = 320, H = 150, L = 34, R = 12, T = 12, B = 22, n = rows.length;
  const ms = rows.map(r => r.s.us - r.s.them);
  const m = Math.max(5, ...ms.map(Math.abs)); const step = niceStep(2 * m); const top = Math.ceil(m / step) * step;
  const y = v => T + (H - T - B) * (1 - (v + top) / (2 * top));
  const slot = (W - L - R) / n, bw = Math.min(26, slot * 0.6);
  let svg = "", hits = "";
  for (let v = -top; v <= top + 1e-9; v += step) svg += '<line class="gl" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"' + (v === 0 ? ' style="stroke:var(--muted)"' : "") + '/><text class="ax" x="' + (L - 6) + '" y="' + (y(v) + 3) + '" text-anchor="end">' + signed(v).replace("–", "0") + "</text>";
  rows.forEach((r, i) => {
    const v = ms[i], x = L + slot * i + (slot - bw) / 2, y0 = y(0), y1 = y(v), rr = Math.min(4, Math.abs(y1 - y0));
    const d = v >= 0
      ? "M" + x + " " + y0 + " V" + (y1 + rr) + " Q" + x + " " + y1 + " " + (x + rr) + " " + y1 + " H" + (x + bw - rr) + " Q" + (x + bw) + " " + y1 + " " + (x + bw) + " " + (y1 + rr) + " V" + y0 + " Z"
      : "M" + x + " " + y0 + " V" + (y1 - rr) + " Q" + x + " " + y1 + " " + (x + rr) + " " + y1 + " H" + (x + bw - rr) + " Q" + (x + bw) + " " + y1 + " " + (x + bw) + " " + (y1 - rr) + " V" + y0 + " Z";
    if (v !== 0) svg += '<path d="' + d + '" style="fill:' + (v > 0 ? "var(--s1)" : "var(--neg)") + '"/>';
    if (n <= 12) svg += '<text class="ax" x="' + (x + bw / 2) + '" y="' + (v >= 0 ? y1 - 4 : y1 + 11) + '" text-anchor="middle" style="fill:var(--ink)">' + signed(v) + "</text>";
    svg += '<text class="ax" x="' + (x + bw / 2) + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(shortOpp(r.g)) + "</text>";
    hits += '<rect class="hit" x="' + (L + slot * i) + '" y="' + T + '" width="' + slot + '" height="' + (H - T - B) + '" data-tip="' + esc("<b>" + esc(r.g.date) + " vs " + esc(r.g.them) + "</b><br>" + (v > 0 ? "Won " : v < 0 ? "Lost " : "Tied ") + r.s.us + "–" + r.s.them) + '"/>';
  });
  svg = hits + svg;
  return chartFrame("Margin", "", '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" role="img" aria-label="Margin of each game">' + svg + "</svg>");
}
let trendWho = null;
function seasonHighs(games){
  const best = [];
  const keep = (k, v, sub, g, cls) => { const cur = best.find(b => b.k === k); if (v != null && (!cur || v > cur.v)) { if (cur) best.splice(best.indexOf(cur), 1); best.push({ k, v, sub, g, cls }); } };
  for (const g of games) {
    const A = aggregate([g]), s = gameScore(g), sp = scoringPlays(g), vs = " vs " + esc(g.them) + " · " + esc(g.date);
    keep("Most points, team", s.us, s.us + "–" + s.them + vs, g);
    const bq = quarters(g).length ? bestQuarter(quarters(g)) : null;
    if (bq) keep("Best quarter", bq.us - bq.them, pLabel(bq.p) + " " + bq.us + "–" + bq.them + vs, g);
    const ru = bestRun(sp, "us", 0), rt = bestRun(sp, "them", 0);
    if (ru) keep("Our biggest run", ru.mine, ru.mine + "–0, " + runSpan(sp, ru) + vs, g, "us");
    if (rt) keep("Biggest run against us", rt.mine, rt.mine + "–0 by " + esc(g.them) + ", " + runSpan(sp, rt) + vs, g, "them");
    for (const p of A.players) {
      keep("Most points, player", p.pts, esc(p.label) + vs, g);
      keep("Most rebounds", p.oreb + p.dreb, esc(p.label) + vs, g);
      keep("Most assists", p.ast, esc(p.label) + vs, g);
      keep("Most steals", p.stl, esc(p.label) + vs, g);
    }
  }
  const order = ["Most points, team", "Best quarter", "Our biggest run", "Biggest run against us", "Most points, player", "Most rebounds", "Most assists", "Most steals"];
  return '<div class="callouts">' + order.map(k => best.find(b => b.k === k)).filter(Boolean).map(b =>
    callout(b.k, b.k === "Best quarter" ? signed(b.v) : b.v, b.sub, ' data-act="report" data-id="' + esc(b.g.id) + '"', b.cls)).join("") + "</div>";
}
function viewTrends(){
  if (viewingScrim()) return '<div class="empty"><b>Trends are for season games</b>Pick season games above; a scrimmage is looked at on its own.</div>';
  const games = selected().slice().sort((a, b) => String(a.date).localeCompare(String(b.date)));
  const rows = games.map(g => { const A = aggregate([g]); return { g, s:gameScore(g), u:A.T.us, t:A.T.them, P:A.players }; });
  const pctV = (m, a) => a ? Math.round(100 * m / a) : null;
  const US = "var(--s1)", THEM = "var(--s2)";
  const players = aggregate(games).players.filter(p => p.gp).sort((a, b) => b.pts - a.pts);
  if (!trendWho || !players.some(p => p.key === trendWho)) trendWho = players.length ? players[0].key : null;
  const who = players.find(p => p.key === trendWho);
  const sel = '<select id="trendwho" aria-label="Player">' + players.map(p => '<option value="' + esc(p.key) + '"' + (p.key === trendWho ? " selected" : "") + ">" + esc(p.label) + "</option>").join("") + "</select>";
  const pRow = (r, f) => { const p = r.P.find(x => x.key === trendWho); return p && p.gp ? f(p) : null; };
  const note = rows.length < 2 ? '<div class="hint">One game so far: each chart becomes a line as games are added.</div>' : "";
  return '<div class="sec">Season highs</div>' + seasonHighs(games) +
    '<div class="hint">Tap a high to open that game\'s report.</div>' +
    '<div class="sec">Game by game</div>' + note + '<div class="trends">' +
    marginChart(rows) +
    lineChart("Points", [{ name:"Us", c:US, v:r => r.s.us }, { name:"Them", c:THEM, v:r => r.s.them }], rows, v => v) +
    lineChart("Points per possession", [{ name:"Us", c:US, v:r => ppp(r.s.us, r.u) }, { name:"Them", c:THEM, v:r => ppp(r.s.them, r.t) }], rows, v => v.toFixed(2), { min:0, axis:v => v.toFixed(1) }) +
    lineChart("Field goal %", [{ name:"Us", c:US, v:r => pctV(r.u.fgm, r.u.fga) }, { name:"Them", c:THEM, v:r => pctV(r.t.fgm, r.t.fga) }], rows, v => v + "%", { min:0, axis:v => v + "%" }) +
    lineChart("3-point %", [{ name:"Us", c:US, v:r => pctV(r.u.tpm, r.u.tpa) }, { name:"Them", c:THEM, v:r => pctV(r.t.tpm, r.t.tpa) }], rows, v => v + "%", { min:0, axis:v => v + "%" }) +
    lineChart("Turnovers", [{ name:"Us", c:US, v:r => r.u.to }, { name:"Them", c:THEM, v:r => r.t.to }], rows, v => v) +
    lineChart("Rebounds", [{ name:"Us", c:US, v:r => r.u.oreb + r.u.dreb }, { name:"Them", c:THEM, v:r => r.t.oreb + r.t.dreb }], rows, v => v) +
    (who ? lineChart("Player points", [{ name:who.label, c:US, v:r => pRow(r, p => p.pts) }], rows, v => v, { legend:sel }) : "") +
    "</div>" + '<div class="hint">Blue is us, orange is them. Hover or tap a game for its numbers. Points per possession is estimated from the box score.</div>';
}

/* ---------- tooltips on the trend charts ---------- */
function showTip(hit){
  const box = hit.closest(".trend"); if (!box) return;
  let tip = box.querySelector(".tip"); if (!tip) { tip = document.createElement("div"); tip.className = "tip"; box.appendChild(tip); }
  tip.innerHTML = hit.dataset.tip;
  box.querySelectorAll(".hit.on").forEach(x => x.classList.remove("on")); hit.classList.add("on");
  const br = box.getBoundingClientRect(), hr = hit.getBoundingClientRect();
  const left = Math.max(6, Math.min(br.width - tip.offsetWidth - 6, hr.left - br.left + hr.width / 2 - tip.offsetWidth / 2));
  tip.style.left = left + "px"; tip.style.top = Math.max(4, hr.top - br.top - tip.offsetHeight + 8) + "px";
}
function hideTip(box){ const tip = box.querySelector(".tip"); if (tip) tip.remove(); box.querySelectorAll(".hit.on").forEach(x => x.classList.remove("on")); }
document.addEventListener("mouseover", ev => { const h = ev.target.closest && ev.target.closest(".trend .hit[data-tip]"); if (h) showTip(h); });
document.addEventListener("mouseout", ev => { const box = ev.target.closest && ev.target.closest(".trend"); if (box && !box.contains(ev.relatedTarget)) hideTip(box); });

function render(){
  header();
  if (state === "loading") return;
  if (!GAMES.length) {
    $("#app").innerHTML = '<main class="inner"><div class="empty"><b>No games yet</b>After each game, Claude copies it here from the stat book: stats right away, film once it is up.</div></main>';
    return;
  }
  if (!pick) pick = new Set(seasonGames().map(g => g.id));
  const A = aggregate(selected());
  const body = !pick.size ? (seasonGames().length ? '<div class="empty"><b>No games counted</b>Tap a game above, or All games.</div>' : "")
    : tab === "report" ? viewReport() : tab === "trends" ? viewTrends() : tab === "team" ? viewTeam(A) : tab === "lineups" ? viewLineups(A) : tab === "shots" ? viewShots(A) : tab === "games" ? viewGames() : viewPlayers(A);
  $("#app").innerHTML = '<main class="inner">' + picker() + (pick.size ? controls() + body : "") + "</main>";
  const mp = $("#minplays"); if (mp) mp.addEventListener("change", ev => { minPlays = +ev.target.value; render(); });
  const ln = $("#lneed"); if (ln) ln.addEventListener("change", ev => { lineupNeed = +ev.target.value; render(); });
  const sw = $("#shotwho"); if (sw) sw.addEventListener("change", ev => { shotWho = ev.target.value; render(); });
  const rg = $("#reportgame"); if (rg) rg.addEventListener("change", ev => { reportId = ev.target.value; render(); });
  const tw = $("#trendwho"); if (tw) tw.addEventListener("change", ev => { trendWho = ev.target.value; render(); });
}

/* ---------- sheets ---------- */
function openSheet(html){ $("#sheet").innerHTML = '<button class="close" data-act="close">Close</button>' + html; $("#sheetWrap").hidden = false; $("#sheet").scrollTop = 0; }
function closeSheet(){ $("#sheetWrap").hidden = true; $("#sheet").innerHTML = ""; }
function whoName(who, games){
  if (who.team) return who.team === "us" ? "Team" : "Opponents";
  if (who.player) { const p = aggregate(games).players.find(r => r.key === who.player); return p ? p.label : who.player; }
  if (who.lineup) { const l = aggregate(games).lineups.find(r => r.key === who.lineup); return l ? l.label : "Lineup"; }
  if (who.lineups) return who.lineups.length + " lineups together";
  return "";
}
function sheetPlays(who, stat, gid){
  const games = gid ? GAMES.filter(g => g.id === gid) : selected();
  sheetItems(esc(whoName(who, games)) + " · " + STAT_NAMES[stat], playsFor(who, stat, games), games.length);
}
function sheetRun(gid, side, allow){
  const g = GAMES.find(x => x.id === gid); if (!g) return;
  const sp = scoringPlays(g), r = bestRun(sp, side, allow); if (!r) return;
  const keys = rosterKeys(g);
  const items = sp.slice(r.i, r.j + 1).map(x => ({ g, e:x.e, keys, after:x.after }));
  sheetItems((side === "us" ? "Our " : esc(g.them) + " ") + r.mine + "–" + r.theirs + " run", items, 1);
}
function sheetZone(z, ctx){
  const games = GAMES.filter(g => ctx.g.includes(g.id));
  const items = spottedShots(games, ctx.who).filter(x => zoneOf(x.e) === z);
  const zn = ZONES.find(x => x.k === z);
  sheetItems(esc(zn ? zn.name : z) + " · our shots", items, games.length);
}
function sheetItems(title, items, nGames){
  const url = watchUrl(items);
  const withFilm = items.filter(clipOf).length;
  const groups = [];
  for (const x of items) { let gr = groups.find(g => g.g === x.g); if (!gr) groups.push(gr = { g:x.g, items:[] }); gr.items.push(x); }
  const rows = groups.map(gr => '<div class="gh">' + esc(gr.g.date) + " · vs " + esc(gr.g.them) + "</div>" + gr.items.map(x => {
    const t = playText(x), c = clipOf(x), one = c ? watchUrl([x]) : null;
    const clock = c && c.t[2] != null ? " " + Math.floor(c.t[2] / 60) + ":" + String(Math.floor(c.t[2] % 60)).padStart(2, "0") : "";
    return '<div class="play"><span class="q">' + pLabel(x.e.p) + clock + "</span><span>" + esc(t.who) + " " + esc(t.what) + (t.res ? ' <span class="' + (t.res === "made" ? "mk" : "ms") + '">' + t.res + "</span>" : "") + (x.after ? ' <span class="pct">· ' + scoreTxt(x.after) + "</span>" : "") + "</span>" +
      (one ? '<a class="watch sm" href="' + esc(one) + '" target="_blank" rel="noopener">▶</a>' : "<span></span>") + "</div>";
  }).join("")).join("");
  const sub = items.length + " play" + (items.length === 1 ? "" : "s") + " in " + nGames + " game" + (nGames === 1 ? "" : "s") +
    (withFilm ? " · " + withFilm + " on film" : "");
  openSheet("<h2>" + title + '</h2><div class="sub">' + sub + "</div>" +
    (url ? '<div><a class="watch" href="' + esc(url) + '" target="_blank" rel="noopener">▶ Watch all ' + withFilm + "</a></div>" : '<div class="nofilm">Film is not linked for these games yet. Once a game\'s film is up, every play here gets a ▶.</div>') +
    (rows || '<div class="empty"><b>None</b>No plays like that in the games counted.</div>'));
}
function sheetPlayer(key){
  const games = selected().slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));
  const rows = [];
  let label = key;
  for (const g of games) {
    const A = aggregate([g]); const r = A.players.find(p => p.key === key);
    if (!r || !r.gp) continue; label = r.label;
    rows.push({ g, r });
  }
  const line = x => "<tr><td><span>" + esc(x.g.date) + "</span></td><td><span>" + esc(x.g.them) + "</span></td><td><span><b>" + x.r.pts + "</b></span></td><td><span>" + x.r.fgm + "-" + x.r.fga + "</span></td><td><span>" + x.r.tpm + "-" + x.r.tpa + "</span></td><td><span>" + x.r.ftm + "-" + x.r.fta + "</span></td><td><span>" + (x.r.oreb + x.r.dreb) + "</span></td><td><span>" + x.r.ast + "</span></td><td><span>" + x.r.stl + "</span></td><td><span>" + x.r.to + "</span></td><td><span>" + signed(x.r.pm) + "</span></td></tr>";
  const shots = [];
  for (const g of games) { const keys = rosterKeys(g); for (const e of g.events) if (e.type === "shot" && e.pts > 1 && e.x != null && e.team === "us" && (keys[e.player] || {}).key === key) shots.push(e); }
  const stats = ["pts", "fgm", "tp", "reb", "ast", "stl", "to"].map(s => '<button class="chip" data-act="plays" data-who="' + esc(JSON.stringify({ player:key })) + '" data-stat="' + s + '">' + STAT_NAMES[s][0].toUpperCase() + STAT_NAMES[s].slice(1) + "</button>").join("");
  openSheet("<h2>" + esc(label) + '</h2><div class="sub">' + rows.length + " game" + (rows.length === 1 ? "" : "s") + " counted</div>" +
    '<div class="row">' + stats + "</div>" +
    '<div class="scroll"><table><tr><th>Date</th><th>Opp</th><th>PTS</th><th>FG</th><th>3P</th><th>FT</th><th>REB</th><th>AST</th><th>STL</th><th>TO</th><th>+/-</th></tr>' + rows.map(line).join("") + "</table></div>" +
    (shots.length ? '<div class="courtwrap">' + courtSvg(shots.map(mark).join("")) + '</div><div class="hint">' + shots.filter(e => e.made).length + " of " + shots.length + " marked field goals made.</div>" : ""));
}

/* ---------- events ---------- */
document.addEventListener("click", ev => {
  const hit = ev.target.closest(".trend .hit[data-tip]"); if (hit) { showTip(hit); return; }
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "close") return closeSheet();
  if (act === "zone") { const c = b.dataset.ctx || (b.closest("[data-ctx]") || {}).dataset?.ctx; if (c) sheetZone(b.dataset.z, JSON.parse(c)); return; }
  if (act === "run") { sheetRun(b.dataset.g, b.dataset.side, +b.dataset.allow); return; }
  if (act === "stints") { sheetStints(b.dataset.g, b.dataset.n); return; }
  if (act === "report") { reportId = b.dataset.id; tab = "report"; try { localStorage.setItem("hub/tab", tab); } catch (e) {} render(); window.scrollTo(0, 0); return; }
  if (act === "shotview") { shotView = b.dataset.v; render(); return; }
  if (act === "lper") { lineupPer = b.dataset.v; render(); return; }
  if (act === "lwith") { const k = b.dataset.k; lineupSel = lineupSel.includes(k) ? lineupSel.filter(x => x !== k) : lineupSel.concat(k); render(); return; }
  if (act === "lwithclear") { lineupSel = []; lineupNeed = 0; render(); return; }
  if (act === "toggle") {
    const g = GAMES.find(x => x.id === b.dataset.id); if (!g) return;
    if (isScrim(g)) pick = pick.has(g.id) && pick.size === 1 ? new Set(seasonGames().map(x => x.id)) : new Set([g.id]);
    else if (viewingScrim()) pick = new Set([g.id]);
    else pick.has(g.id) ? pick.delete(g.id) : pick.add(g.id);
    reportId = pick.has(g.id) ? g.id : null;      // the report follows the game just picked
    render(); return;
  }
  if (act === "only") { pick = new Set([b.dataset.id]); reportId = b.dataset.id; tab = "report"; render(); window.scrollTo(0, 0); return; }
  if (act === "quick") {
    const sorted = byDate(seasonGames());
    pick = new Set(b.dataset.v === "last3" ? sorted.slice(0, 3).map(g => g.id) : sorted.map(g => g.id)); reportId = null; render(); return;
  }
  if (act === "tab") { tab = b.dataset.v; try { localStorage.setItem("hub/tab", tab); } catch (e) {} render(); return; }
  if (act === "mode") { mode = b.dataset.v; render(); return; }
  if (act === "shotteam") { shotTeam = b.dataset.v; render(); return; }
  if (act === "sort") { const st = sortState[b.dataset.t], k = b.dataset.k; if (st.k !== k) { st.k = k; st.d = 1; } else st.d = (st.d + 1) % 3; render(); return; }
  if (act === "plays") { sheetPlays(JSON.parse(b.dataset.who), b.dataset.stat, b.dataset.g); return; }
  if (act === "player") { sheetPlayer(b.dataset.key); return; }
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && !$("#sheetWrap").hidden) closeSheet(); });

/* ---------- load ---------- */
async function load(){
  render();
  const timer = setTimeout(() => { if (state === "loading") { state = "error"; $("#app").innerHTML = '<main class="inner"><div class="empty"><b>The season did not load</b>Close the page and open it again. If it keeps happening, tell Claude.</div></main>'; } }, 10000);
  try {
    const db = window.claude && await window.claude.use("db");
    if (!db) { clearTimeout(timer); state = "error"; $("#app").innerHTML = '<main class="inner"><div class="empty"><b>Sign in to see the season</b>The games are kept with this page on claude.ai.</div></main>'; return; }
    const [gs, fs, meta] = await Promise.all([
      db.collection("games").get(),
      db.collection("films").get().catch(() => null),
      db.doc("meta/players").get().catch(() => null)
    ]);
    clearTimeout(timer);
    GAMES = gs.docs.map(d => d.data()).filter(g => g && Array.isArray(g.events));
    FILMS = {}; if (fs) fs.docs.forEach(d => { FILMS[d.id] = d.data(); });
    const m = meta && meta.exists ? meta.data() : null;
    ALIASES = {}; if (m && m.aliases) Object.entries(m.aliases).forEach(([k, v]) => { ALIASES[k.toLowerCase()] = v; });
    state = "ready";
    render();
  } catch (e) {
    clearTimeout(timer); state = "error";
    $("#app").innerHTML = '<main class="inner"><div class="empty"><b>The season did not load</b>' + esc(e && e.message || e) + "</div></main>";
  }
}
load();
})();
</script>
