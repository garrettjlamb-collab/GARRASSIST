<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Film review</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#0f1218; --panel:#171c26; --line:#2a3242; --text:#e6e9ef; --muted:#8b95a7; --ok:#3ddc84; --bad:#ff5c5c; --accent:#4c8dff; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--text); display:grid; grid-template-columns:260px 1fr; height:100vh; }
  aside { border-right:1px solid var(--line); padding:12px; overflow:auto; }
  main { padding:16px; overflow:auto; }
  h1 { font-size:16px; margin:0 0 12px; }
  .game { padding:8px; border:1px solid var(--line); border-radius:6px; margin-bottom:8px; cursor:pointer; }
  .game.sel { border-color:var(--accent); }
  .game.broken { opacity:0.45; cursor:default; }
  .game small { color:var(--muted); display:block; }
  nav button { background:var(--panel); color:var(--text); border:1px solid var(--line); padding:6px 12px; border-radius:6px; cursor:pointer; margin-right:6px; }
  nav button.sel { border-color:var(--accent); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; margin-top:12px; max-width:960px; }
  video { width:100%; max-width:640px; background:#000; border-radius:6px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:10px; font-weight:600; margin-right:6px; }
  .made { background:var(--ok); color:#062; } .warm { background:#5a4a1a; color:#ffd27a; } .miss { background:var(--bad); color:#400; } .none { background:var(--line); }
  .muted { color:var(--muted); }
  .keys { color:var(--muted); font-size:12px; margin-top:8px; }
  kbd { background:var(--line); padding:1px 5px; border-radius:4px; font-family:inherit; }
  canvas { max-width:100%; border:1px solid var(--line); border-radius:6px; cursor:crosshair; }
  .card.wide { max-width:none; overflow:auto; } canvas.zoom { max-width:none; width:200%; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .btn { background:var(--accent); color:#fff; border:0; padding:6px 12px; border-radius:6px; cursor:pointer; }
  .list { margin-top:12px; max-height:240px; overflow:auto; font-size:12px; max-width:960px; }
  .list div { padding:3px 6px; border-bottom:1px solid var(--line); cursor:pointer; }
  #status { min-height:18px; margin-top:8px; color:var(--bad); font-weight:600; }
  .list div.sel { background:#22304a; }
</style>
</head>
<body>
<aside>
  <h1>Games</h1>
  <div id="games"></div>
</aside>
<main>
  <nav>
    <button data-tab="shots" class="sel">Shots</button>
    <button data-tab="quarters">Quarters</button>
    <button data-tab="rim">Label rim</button>
    <button data-tab="ball">Label ball</button>
    <button data-tab="rimclf">Label clips</button>
    <button data-tab="court">Label court</button>
  </nav>
  <div id="status"></div>
  <section id="shots"></section>
  <section id="quarters" hidden></section>
  <section id="label" hidden></section>
</main>
<script>
const state = { game: null, tab: "shots", events: [], index: 0, label: null, boxes: [], selected: -1, drawing: null, img: null, busy: false, rate: 1, skippedPoints: new Set(), pointIndex: -1 };
const RATES = [1, 1.5, 2];
const LEAD_IN_S = 3;   // each clip opens this long before the shot; R replays the whole play
const isWarm = (e) => (e.flags || []).includes("warmup");
const CLASSES = { rim: ["rim", "backboard"], ball: ["ball"] };
const $ = (sel) => document.querySelector(sel);
const api = async (url, opts) => { const r = await fetch(url, opts); if (!r.ok) throw new Error(await r.text()); return r.json(); };
const post = (url, body) => api(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
const clock = (s) => s == null ? "--" : `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let statusTimer = null;
function showError(err) {
  const el = $("#status");
  el.style.color = "";
  el.textContent = `Error: ${err && err.message ? err.message : err}`;
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => { el.textContent = ""; }, 6000);
}
function showNote(text) {
  const el = $("#status");
  el.textContent = text;
  el.style.color = "var(--ok)";
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => { el.textContent = ""; el.style.color = ""; }, 8000);
}
// Run one awaited action at a time; a failure is shown and leaves the page state as it was.
async function guarded(fn) {
  if (state.busy) return;
  state.busy = true;
  try { await fn(); } catch (err) { showError(err); } finally { state.busy = false; }
}

async function loadGames() {
  const games = await api("/api/games");
  state.games = games;
  $("#games").innerHTML = games.map(g => g.error
    ? `<div class="game broken" title="${esc(g.error)}"><b>${esc(g.game_id)}</b><small>cannot be read: ${esc(g.error)}</small></div>`
    : `<div class="game ${g.game_id === state.game ? "sel" : ""}" data-id="${esc(g.game_id)}"><b>${esc(g.title || g.game_id)}</b><small>${esc(g.profile)} · ${g.decided}/${g.events} decided${g.title && g.title !== g.game_id ? " · " + esc(g.game_id) : ""}</small></div>`).join("")
    || "<div class='muted'>No games yet. Run: film run &lt;file&gt;</div>";
  document.querySelectorAll(".game:not(.broken)").forEach(el => el.onclick = () => selectGame(el.dataset.id));
  const readable = games.filter(g => !g.error);
  if (!state.game && readable.length) selectGame(readable[0].game_id);
}

const ZONE_LABELS = {restricted:"Restricted Area", paint:"Paint", "mid-left":"Mid-Range Left", "mid-right":"Mid-Range Right", "mid-center":"Mid-Range Center", "corner-3-left":"Left Corner 3", "corner-3-right":"Right Corner 3", "wing-3-left":"Left Wing 3", "wing-3-right":"Right Wing 3", "top-3":"Top of Key 3"};

// ---- The half court: feet on the tracker's half court, baseline at the bottom, basket near the bottom centre ----
const HALF = { w: 50, h: 47, basketX: 25, basketY: 5.25, arc: 19.75, laneL: 17, laneR: 33, ftY: 19, ftR: 6, restricted: 4, cornerY: 10, floater: 9 };
// The card draws the half court the way the camera sees it: across, with the basket on the side of the
// picture it is on (the event's basket_side; when unknown, the side last chosen). Feet are the tracker's
// half court whatever the drawing: x across the baseline, y away from it. All drawing, clicks and nudges
// go through one affine map from feet to canvas pixels.
const SCALE = 5;                                                     // px per foot
function courtView(e) {
  let side = e && e.basket_side;
  if (!side) { try { side = localStorage.getItem("basketSide") || "left"; } catch (err) { side = "left"; } }
  return side;
}
function courtCanvasSize() { return { w: HALF.h * SCALE, h: HALF.w * SCALE }; }
// [a, b, c, d, tx, ty]: px = a*x + c*y + tx, py = b*x + d*y + ty.  Basket on the left: the baseline is the
// left edge, x runs down the picture (your left on the near baseline is the top sideline). On the right:
// the mirror image, so the far sideline stays at the top.
function courtMatrix(side) {
  const { w, h } = courtCanvasSize();
  return side === "right" ? [0, -SCALE, -SCALE, 0, w, h] : [0, SCALE, SCALE, 0, 0, 0];
}
function toPxM(m, x, y) { return [m[0] * x + m[2] * y + m[4], m[1] * x + m[3] * y + m[5]]; }
function toFtM(m, px, py) {
  const det = m[0] * m[3] - m[1] * m[2], dx = px - m[4], dy = py - m[5];
  return [(m[3] * dx - m[2] * dy) / det, (-m[1] * dx + m[0] * dy) / det];
}

// Port of film/interpret/zones.py (zone_of, shot_type_of): same constants, same order of checks.
function zoneOf(x, y) {
  const dx = x - HALF.basketX, dy = y - HALF.basketY;
  const dist = Math.hypot(dx, dy), ang = Math.atan2(dx, dy) * 180 / Math.PI;
  if (dist <= HALF.restricted) return "restricted";
  if (dist > HALF.arc) {
    if (y < HALF.cornerY) return x < HALF.basketX ? "corner-3-left" : "corner-3-right";
    if (ang < -35) return "wing-3-left";
    if (ang > 35) return "wing-3-right";
    return "top-3";
  }
  if (HALF.laneL <= x && x <= HALF.laneR && y <= HALF.ftY) return "paint";
  if (ang < -25) return "mid-left";
  if (ang > 25) return "mid-right";
  return "mid-center";
}
function shotTypeOf(x, y) {
  const dist = Math.hypot(x - HALF.basketX, y - HALF.basketY);
  if (dist <= HALF.restricted) return "rim";
  if (dist > HALF.arc) return "three";
  if (dist <= HALF.floater && y <= HALF.ftY) return "floater";
  return "midrange";
}
// Before a save the label follows the dot (client port); otherwise the server's values stand.
function zoneLine(e) {
  if (e.x == null || e.y == null) return "No dot yet: click the court";
  const zone = e.dotMoved || !e.zone ? zoneOf(e.x, e.y) : e.zone, type = e.dotMoved || !e.shot_type ? shotTypeOf(e.x, e.y) : e.shot_type;
  return esc(ZONE_LABELS[zone] || zone || "") + " · " + esc(type || "") + (e.dotMoved ? " · unsaved" : e.location_conf != null ? " · dot conf " + e.location_conf : "");
}

function drawHalfCourt(cv, e) {
  const { w, h } = courtCanvasSize(), m = courtMatrix(courtView(e)), ctx = cv.getContext("2d");
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#1b2130"; ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = "#8b95a7"; ctx.lineWidth = 1;
  ctx.strokeRect(0.5, 0.5, w - 1, h - 1);
  ctx.setTransform(m[0], m[1], m[2], m[3], m[4], m[5]);              // from here on, feet
  ctx.lineWidth = 1 / SCALE;
  ctx.strokeRect(HALF.laneL, 0, HALF.laneR - HALF.laneL, HALF.ftY);
  ctx.beginPath(); ctx.arc(HALF.basketX, HALF.basketY, HALF.arc, 0, Math.PI); ctx.stroke();        // the arc, away from the baseline
  ctx.beginPath(); ctx.moveTo(HALF.basketX - HALF.arc, 0); ctx.lineTo(HALF.basketX - HALF.arc, HALF.basketY);
  ctx.moveTo(HALF.basketX + HALF.arc, 0); ctx.lineTo(HALF.basketX + HALF.arc, HALF.basketY); ctx.stroke();
  ctx.beginPath(); ctx.arc(HALF.basketX, HALF.ftY, HALF.ftR, 0, 2 * Math.PI); ctx.stroke();
  ctx.strokeStyle = "#ff8c42"; ctx.beginPath(); ctx.arc(HALF.basketX, HALF.basketY, 0.75, 0, 2 * Math.PI); ctx.stroke();
  if (e.x != null && e.y != null) {
    ctx.fillStyle = e.made ? "#3ddc84" : "#ff5c5c";
    ctx.beginPath(); ctx.arc(e.x, e.y, 6 / SCALE, 0, 2 * Math.PI); ctx.fill();
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#8b95a7"; ctx.font = "10px sans-serif"; ctx.textAlign = "center";
  const side = courtView(e);
  ctx.fillText("basket " + side + " · B flips", w / 2, h - 4);
}

function setDot(e, x, y) {
  e.x = Math.max(0, Math.min(HALF.w, Math.round(x * 10) / 10)); e.y = Math.max(0, Math.min(HALF.h, Math.round(y * 10) / 10));
  e.dotMoved = true;
  const cv = $("#court");
  if (!cv) { renderShots(); return; }
  drawHalfCourt(cv, e);
  const z = $("#zone-line"); if (z) z.innerHTML = zoneLine(e);
}
const dotBody = (e) => e.dotMoved ? { x: e.x, y: e.y } : {};

const isWeak = (e) => (e.signals || {}).source === "motion" || (e.flags || []).includes("clf-none");

// The queue: undecided strong cards first, in game order; then undecided weak ones; then warmups; decided
// cards last. The coach only ever moves forward through what still needs him.
function sortQueue() {
  state.events.sort((a, b) => (!!a.decision - !!b.decision) || (isWarm(a) - isWarm(b)) || (isWeak(a) - isWeak(b)) || ((a.x == null) - (b.x == null)) * -1 || (a.t - b.t));
}

function nextUndecided(from) {
  for (let i = from; i < state.events.length; i++) if (!state.events[i].decision) return i;
  for (let i = 0; i < from; i++) if (!state.events[i].decision) return i;
  return Math.min(from, state.events.length - 1);
}

async function selectGame(id) {
  state.game = id;
  state.events = await api(`/api/games/${id}/events`);
  sortQueue();
  state.index = nextUndecided(0);
  await loadGames();
  render();
}

function render() {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("sel", b.dataset.tab === state.tab));
  $("#shots").hidden = state.tab !== "shots";
  $("#quarters").hidden = state.tab !== "quarters";
  $("#label").hidden = state.tab === "shots" || state.tab === "quarters";
  if (state.tab === "shots") renderShots();
  else if (state.tab === "quarters") loadQuarters().catch(showError);
  else loadLabel();
}

function renderShots() {
  const el = $("#shots");
  if (!state.game) { el.innerHTML = "<p class='muted'>Pick a game.</p>"; return; }
  const decided = state.events.filter(e => e.decision).length;
  const e = state.events[state.index];
  const isWeakCard = isWeak;
  const strongLeft = state.events.filter(x => !x.decision && !isWarm(x) && !isWeakCard(x)).length;
  const stopNote = e && !e.decision && (isWeakCard(e) || isWarm(e)) && strongLeft === 0
    ? `<div class="card" style="border-color:var(--ok)"><b>Strong cards done for this game.</b> What follows is optional: weak cards (motion only, or nothing seen at the rim) and warmups. Pick the next game, or keep going if you like.</div>` : "";
  const g = (state.games || []).find(x => x.game_id === state.game);
  const needMarks = g && !g.scoreboard && !g.quarters
    ? `<div class="card"><b>This game has no scoreboard.</b> Mark the quarters first, so warmup shots are set aside and each shot gets its quarter. <button class="btn" id="go-quarters">Mark quarters</button></div>` : "";
  if (!e) { el.innerHTML = `<p>No events for this game yet.</p>`; return; }
  const madeBadge = e.made === true ? "<span class='badge made'>MADE</span>" : e.made === false ? "<span class='badge miss'>MISSED</span>" : "<span class='badge none'>UNKNOWN</span>";
  const dec = e.decision ? `<span class='badge none'>${esc(e.decision.status)}</span>` : "";
  const warm = isWarm(e) ? "<span class='badge warm'>WARMUP · not counted</span>" : "";
  const weakBadge = !isWarm(e) && isWeakCard(e) ? "<span class='badge none'>WEAK · optional</span>" : "";
  const foulBadge = e.foul === "on_shot" ? "<span class='badge warm'>FOULED ON THE SHOT</span>"
    : e.foul === "before_shot" ? "<span class='badge warm'>WHISTLE FIRST · not an attempt</span>" : "";
  el.innerHTML = `
    <div class="row"><b>${decided}/${state.events.length} decided</b><span class="muted">${state.index + 1} of ${state.events.length}</span>
      <button class="btn" id="confirm-high">Confirm all above 0.9</button><span class="muted"><b>${strongLeft}</b> strong cards left</span></div>
    ${needMarks}${stopNote}
    <div class="card">
      <video id="clip" src="/clips/${esc(state.game)}/${esc(e.id)}.mp4" autoplay loop muted playsinline></video>
      <div style="display:inline-block;vertical-align:top;margin-left:12px">
        <canvas id="court" width="${courtCanvasSize().w}" height="${courtCanvasSize().h}" style="border-radius:6px;cursor:crosshair"></canvas>
        <div class="muted" id="zone-line">${zoneLine(e)}</div>
      </div>
      <div style="margin-top:8px">${warm}${weakBadge}${madeBadge}${foulBadge}<span class="badge none">${esc(e.type)}</span>${dec}
        <b>Q${e.quarter ?? "?"} ${clock(e.clock_s)}</b> <span class="muted">t=${e.t.toFixed(1)}s · team ${esc(e.team ?? "?")} · conf ${e.confidence} · ${e.rim_id < 0 ? "scoreboard only" : "rim " + e.rim_id}</span></div>
      <div class="muted" style="margin-top:4px">${esc((e.flags || []).join(" ") || "no flags")} · ${esc(JSON.stringify(e.signals))}</div>
      <div class="keys"><kbd>Enter</kbd> confirm <kbd>M</kbd> toggle made <kbd>T</kbd> team <kbd>W</kbd> foul (on the shot / whistle first / none) <kbd>X</kbd> reject <kbd>U</kbd> unsure <kbd>L</kbd> open film <kbd>R</kbd> replay the play <kbd>Click</kbd> court places the dot <kbd>←↑↓→</kbd> nudge 1 ft (<kbd>Shift</kbd> 5 ft) <kbd>B</kbd> basket on the other side <kbd>F</kbd> speed <span id="rate">${state.rate}x</span> <kbd>J</kbd>/<kbd>K</kbd> prev/next</div>
    </div>
    <div class="list">${state.events.map((x, i) => `<div class="${i === state.index ? "sel" : ""}" data-i="${i}">${x.decision ? "✓" : "·"}${isWarm(x) ? " warmup" : ""} ${esc(x.id)} Q${x.quarter ?? "?"} ${clock(x.clock_s)} ${x.made === true ? "made" : x.made === false ? "missed" : "?"} ${x.confidence}${x.foul ? " · foul" : ""}</div>`).join("")}</div>`;
  $("#confirm-high").onclick = confirmHigh;
  if ($("#go-quarters")) $("#go-quarters").onclick = () => { state.tab = "quarters"; render(); };
  drawHalfCourt($("#court"), e);
  $("#court").onclick = (ev) => {
    const c = $("#court"), r = c.getBoundingClientRect();
    const { w, h } = courtCanvasSize(), sx = w / c.clientWidth, sy = h / c.clientHeight;   // CSS scaling; clientLeft/Top skip the border
    const [x, y] = toFtM(courtMatrix(courtView(e)), (ev.clientX - r.left - c.clientLeft) * sx, (ev.clientY - r.top - c.clientTop) * sy);
    setDot(e, x, y);
  };
  const video = $("#clip");
  video.onloadedmetadata = () => {
    const shotAt = e.clip ? e.t - e.clip.start : 0;
    video.currentTime = Math.max(0, shotAt - LEAD_IN_S);
    video.playbackRate = state.rate;
  };
  document.querySelectorAll(".list div").forEach(d => d.onclick = () => { state.index = +d.dataset.i; renderShots(); });
}

// After a save the dot is the server's: adopt its values and let zone/type come from them (the same rules as zoneOf).
function settleDot(e) {
  if (!e.dotMoved) return;
  e.dotMoved = false;
  if (e.x != null && e.y != null) { e.zone = zoneOf(e.x, e.y); e.shot_type = shotTypeOf(e.x, e.y); }
}

function decide(status) {
  return guarded(async () => {
    const e = state.events[state.index];
    if (!e) return;
    e.decision = await post(`/api/games/${state.game}/decisions/${e.id}`, { status, made: e.made, team: e.team, foul: e.foul || null, ...dotBody(e) });
    settleDot(e);
    state.index = nextUndecided(state.index + 1);
    renderShots();
    loadGames().catch(showError);
  });
}

function confirmHigh() {
  return guarded(async () => {
    try {
      for (const e of state.events) {
        if (!e.decision && e.type === "shot" && e.confidence >= 0.9) {
          e.decision = await post(`/api/games/${state.game}/decisions/${e.id}`, { status: "confirmed", made: e.made, team: e.team, foul: e.foul || null, ...dotBody(e) });
          settleDot(e);
        }
      }
    } finally {
      sortQueue();                                   // the confirmed cards drop to the back, out of the way
      state.index = nextUndecided(0);
      renderShots();
      loadGames().catch(showError);
    }
  });
}

function shotKeys(ev) {
  const e = state.events[state.index];
  if (!e) return;
  const k = ev.key.toLowerCase();
  if (ev.key === "Enter") decide("confirmed");
  else if (k === "m") { e.made = e.made !== true; renderShots(); }
  else if (k === "t") { e.team = e.team === "home" ? "away" : e.team === "away" ? null : "home"; renderShots(); }
  else if (k === "w") { e.foul = e.foul === "on_shot" ? "before_shot" : e.foul === "before_shot" ? null : "on_shot"; renderShots(); }
  else if (k === "x") decide("rejected");
  else if (k === "u") decide("unsure");
  else if (k === "l") window.open(`/film.html?game=${encodeURIComponent(state.game)}&t=${Math.max(0, e.clip ? e.clip.start : e.t - 8).toFixed(1)}`, "_blank");
  else if (k === "r") { const v = $("#clip"); if (v) { v.currentTime = 0; v.play(); } }
  else if (k === "f") {
    state.rate = RATES[(RATES.indexOf(state.rate) + 1) % RATES.length];
    const v = $("#clip"); if (v) v.playbackRate = state.rate;
    const r = $("#rate"); if (r) r.textContent = `${state.rate}x`;
  }
  else if (k === "j") { state.index = Math.max(0, state.index - 1); renderShots(); }
  else if (k === "k") { state.index = Math.min(state.events.length - 1, state.index + 1); renderShots(); }
  else if (ev.key.startsWith("Arrow") && e.x != null) {             // nudge the way the arrow points on the picture
    const s = ev.shiftKey ? 5 : 1, m = courtMatrix(courtView(e));
    const dpx = (ev.key === "ArrowRight" ? s : ev.key === "ArrowLeft" ? -s : 0) * SCALE, dpy = (ev.key === "ArrowDown" ? s : ev.key === "ArrowUp" ? -s : 0) * SCALE;
    const [x0, y0] = toFtM(m, 0, 0), [x1, y1] = toFtM(m, dpx, dpy);
    setDot(e, e.x + (x1 - x0), e.y + (y1 - y0));
  }
  else if (ev.key === "b" || ev.key === "B") {                        // the basket is on the other side of the picture
    const next = courtView(e) === "right" ? "left" : "right";
    e.basket_side = next;
    try { localStorage.setItem("basketSide", next); } catch (err) {}
    drawHalfCourt($("#court"), e);
  }
  else return;
  ev.preventDefault();
}

// ---- Quarters: for film with no scoreboard, the coach marks when each quarter starts and ends ----
const hms = (s) => s == null ? "--:--" : `${Math.floor(s / 3600)}:${String(Math.floor(s % 3600 / 60)).padStart(2, "0")}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

// The full film may be in iCloud only: ask the server for it and wait here until it is on the Mac.
// Resolves false if the coach moved on to another game or tab while waiting.
async function filmReady(game, el) {
  let f = await post(`/api/games/${game}/film`);
  while (f.state !== "local") {
    if (f.state === "missing") throw new Error("the film file is not where this game says it is");
    if (f.error) throw new Error(f.error);
    el.innerHTML = `<p class="muted">Pulling the full film from iCloud (${(f.size_bytes / 1e9).toFixed(1)} GB)… it will load here when it arrives.</p>`;
    await new Promise((done) => setTimeout(done, 5000));
    if (state.game !== game || state.tab !== "quarters") return false;
    f = await api(`/api/games/${game}/film`);
  }
  return true;
}

async function loadQuarters() {
  const el = $("#quarters");
  if (!state.game) { el.innerHTML = "<p class='muted'>Pick a game.</p>"; return; }
  const game = state.game;
  const q = await api(`/api/games/${game}/quarters`);
  if (!(await filmReady(game, el))) return;
  state.marks = q.quarters.map(([a, b]) => [a, b]);
  el.innerHTML = `
    <div class="card wide">
      <video id="film" src="/video/${esc(state.game)}" controls preload="metadata" tabindex="-1" style="width:100%;max-width:1280px"></video>
      <div class="row" style="margin-top:8px">
        <button class="btn" id="q-start">Quarter starts here</button>
        <button class="btn" id="q-end">Quarter ends here</button>
        <span class="muted">film at <b id="q-now">0:00:00</b></span>
      </div>
      <div id="q-list" style="margin-top:8px"></div>
      <div class="row" style="margin-top:8px"><button class="btn" id="q-save">Save quarters</button><span id="q-msg" class="muted"></span></div>
      <div class="keys">Drag or play the film to the tip-off and press <kbd>[</kbd> (quarter starts); to the buzzer and press <kbd>]</kbd> (quarter ends). Four times, plus overtime.
        <kbd>Space</kbd> play/pause <kbd>←</kbd>/<kbd>→</kbd> 5 s, always; drag the bar for big moves. ${q.scoreboard ? "This game has a scoreboard: marks here override it." : ""}</div>
    </div>`;
  const film = $("#film");
  film.ontimeupdate = () => { if (!film.seeking) $("#q-now").textContent = hms(film.currentTime); };
  film.addEventListener("focus", () => film.blur());
  film.onseeked = () => { state.seekTarget = null; $("#q-now").textContent = hms(film.currentTime); };
  $("#q-start").onclick = () => markQuarter("start");
  $("#q-end").onclick = () => markQuarter("end");
  $("#q-save").onclick = saveQuarters;
  drawMarks();
}

function drawMarks() {
  $("#q-list").innerHTML = state.marks.length ? state.marks.map(([a, b], i) =>
    `<div class="row"><b>${i < 4 ? "Q" + (i + 1) : "OT" + (i - 3)}</b> <a href="#" data-seek="${a}">${hms(a)}</a> to ${b == null ? "<i>no end yet</i>" : `<a href="#" data-seek="${b}">${hms(b)}</a>`}
     <button class="btn" data-del="${i}" style="background:var(--line)">remove</button></div>`).join("") : "<p class='muted'>No quarters marked yet.</p>";
  document.querySelectorAll("[data-seek]").forEach(a => a.onclick = (ev) => { ev.preventDefault(); $("#film").currentTime = +a.dataset.seek; });
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { state.marks.splice(+b.dataset.del, 1); drawMarks(); });
}

function markQuarter(which) {
  const t = Math.round($("#film").currentTime * 10) / 10;
  const last = state.marks[state.marks.length - 1];
  if (which === "start") {
    if (last && last[1] == null) last[0] = t; else state.marks.push([t, null]);
  } else if (last && last[1] == null && t > last[0]) last[1] = t;
  else { showError("press [ at the tip-off first; a quarter ends after it starts"); return; }
  state.marks.sort((x, y) => x[0] - y[0]);
  drawMarks();
}

function saveQuarters() {
  return guarded(async () => {
    if (state.marks.some(([, b]) => b == null)) throw new Error("every quarter needs an end: press ] at its buzzer, or remove it");
    const r = await post(`/api/games/${state.game}/quarters`, { quarters: state.marks });
    state.tab = "shots";
    await selectGame(state.game);
    showNote(`Saved ${r.quarters} quarters: ${r.warmups} of ${r.events} cards are warmups, sorted last.`);
  });
}

// A big film seeks slowly; while a seek is still in flight currentTime reports the old position, so quick
// presses were being lost. Steps add up on a target instead, and the display shows the target at once.
function seekBy(film, delta) {
  const base = film.seeking && state.seekTarget != null ? state.seekTarget : film.currentTime;
  state.seekTarget = Math.max(0, Math.min(film.duration || Infinity, base + delta));
  film.currentTime = state.seekTarget;
  $("#q-now").textContent = hms(state.seekTarget);
}

function quarterKeys(ev) {
  const film = $("#film");
  if (!film) return;
  // The player's own keyboard handling (arrows, space) must not fire as well: it was adding its own skips
  // to ours. The video is not focusable and never keeps focus.
  if (document.activeElement === film) film.blur();
  if (ev.key === "[") markQuarter("start");
  else if (ev.key === "]") markQuarter("end");
  else if (ev.key === " ") { if (film.paused) film.play(); else film.pause(); }
  else if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") seekBy(film, ev.key === "ArrowLeft" ? -5 : 5);
  else return;
  ev.preventDefault();
  ev.stopPropagation();
}

async function loadLabel() {
  const dataset = state.tab;
  try {
    state.label = await api(`/api/label/${dataset}/next`);
  } catch (err) {
    state.label = null;
    $("#label").innerHTML = `<p class='muted'>Could not load the ${esc(dataset)} queue.</p>`;
    showError(err);
    return;
  }
  if (state.label.done) {
    $("#label").innerHTML = `<p>Nothing pending for <b>${esc(dataset)}</b>. Queue more with: film prelabel ${esc(dataset)} &lt;game_id&gt;</p>`;
    return;
  }
  if (dataset === "rimclf") renderClipLabel(); else if (dataset === "court") renderCourtLabel(); else renderBoxLabel();
}

function renderClipLabel() {
  const l = state.label;
  $("#label").innerHTML = `<div class="row"><b>${l.remaining} pending</b><span class="muted">${esc(l.image_id)} · suggested: ${esc(l.suggested || "?")}</span></div>
    <div class="card"><img src="${l.image_url}" style="width:576px;max-width:100%">
    <div class="keys">Nine frames, left to right then top to bottom, 0.2 s apart, starting 0.4 s before the ball reaches the rim.
    <kbd>1</kbd> made <kbd>2</kbd> missed <kbd>3</kbd> not a shot <kbd>K</kbd> skip</div></div>`;
}

async function clipKeys(ev) {
  const l = state.label;
  if (!l || l.done) return;
  const map = { "1": "made", "2": "missed", "3": "none" };
  const isKey = map[ev.key] || ev.key.toLowerCase() === "k";
  if (!isKey) return;
  ev.preventDefault();
  await guarded(async () => {
    if (map[ev.key]) await post(`/api/label/rimclf/${l.image_id}/class`, { cls: map[ev.key] });
    else await post(`/api/label/rimclf/${l.image_id}/skip`);
    await loadLabel();
  });
}

function renderBoxLabel() {
  const l = state.label;
  const names = CLASSES[state.tab];
  state.boxes = l.boxes.map(b => ({ cls: b.cls, x1: b.x1, y1: b.y1, x2: b.x2, y2: b.y2 }));
  state.selected = -1;
  state.img = null;
  $("#label").innerHTML = `<div class="row"><b>${l.remaining} pending</b><span class="muted">${esc(l.image_id)}</span></div>
    <div class="card wide"><canvas id="cv" class="${state.zoom ? "zoom" : ""}" width="${l.width}" height="${l.height}"></canvas>
    <div class="keys">Drag to draw a box. Click a box to select it. <kbd>Delete</kbd> remove <kbd>Z</kbd> zoom
    ${names.map((n, i) => `<kbd>${i + 1}</kbd> ${esc(n)}`).join(" ")} <kbd>S</kbd> save <kbd>D</kbd> skip</div></div>`;
  const img = new Image();
  img.onload = () => { state.img = img; drawBoxes(); };
  img.src = l.image_url;
  const cv = $("#cv");
  cv.onmousedown = (ev) => {
    const p = canvasPos(ev);
    state.drawing = { x1: p.x, y1: p.y, x2: p.x, y2: p.y, sx: ev.clientX, sy: ev.clientY };
  };
  cv.onmousemove = (ev) => { if (!state.drawing) return; const p = canvasPos(ev); state.drawing.x2 = p.x; state.drawing.y2 = p.y; drawBoxes(); };
}

function canvasPos(ev) {
  const cv = $("#cv");
  const r = cv.getBoundingClientRect();
  return { x: (ev.clientX - r.left) * cv.width / r.width, y: (ev.clientY - r.top) * cv.height / r.height };
}

// On release (anywhere in the window): a drag under 4 px is a click that selects the smallest box
// under the pointer; a longer drag draws a new box, even when it starts inside an existing one.
window.addEventListener("mouseup", (ev) => {
  const d = state.drawing;
  state.drawing = null;
  if (!d || !$("#cv") || state.tab === "shots" || state.tab === "rimclf" || state.tab === "court") return;
  const moved = Math.hypot(ev.clientX - d.sx, ev.clientY - d.sy);
  if (moved < 4) {
    let hit = -1, best = Infinity;
    state.boxes.forEach((b, i) => {
      const area = (b.x2 - b.x1) * (b.y2 - b.y1);
      if (d.x1 >= b.x1 && d.x1 <= b.x2 && d.y1 >= b.y1 && d.y1 <= b.y2 && area < best) { hit = i; best = area; }
    });
    state.selected = hit;
  } else {
    const p = canvasPos(ev);
    const x2 = Math.max(0, Math.min($("#cv").width, p.x)), y2 = Math.max(0, Math.min($("#cv").height, p.y));
    const names = CLASSES[state.tab];
    // On the rim tab the usual label is the backboard: big and crisp where the rim itself is a few pixels.
    const b = { cls: state.tab === "rim" ? "backboard" : names[0], x1: Math.min(d.x1, x2), y1: Math.min(d.y1, y2), x2: Math.max(d.x1, x2), y2: Math.max(d.y1, y2) };
    if (b.x2 - b.x1 > 3 && b.y2 - b.y1 > 3) { state.boxes.push(b); state.selected = state.boxes.length - 1; }
  }
  drawBoxes();
});

function drawBoxes() {
  const cv = $("#cv");
  if (!cv || !state.img) return;
  const ctx = cv.getContext("2d");
  ctx.drawImage(state.img, 0, 0);
  const colours = { rim: "#3ddc84", backboard: "#4c8dff", ball: "#ffc857" };
  ctx.font = "14px sans-serif";
  state.boxes.forEach((b, i) => {
    ctx.lineWidth = i === state.selected ? 4 : 2;
    ctx.strokeStyle = colours[b.cls] || "#fff";
    ctx.strokeRect(b.x1, b.y1, b.x2 - b.x1, b.y2 - b.y1);
    ctx.fillStyle = ctx.strokeStyle;
    ctx.fillText(b.cls, b.x1 + 2, Math.max(12, b.y1 - 4));
  });
  if (state.drawing) {
    const d = state.drawing;
    ctx.setLineDash([6, 4]);
    ctx.strokeStyle = "#fff";
    ctx.strokeRect(Math.min(d.x1, d.x2), Math.min(d.y1, d.y2), Math.abs(d.x2 - d.x1), Math.abs(d.y2 - d.y1));
    ctx.setLineDash([]);
  }
}

const COURT_POINTS = ["near-corner-left", "near-corner-right", "near-lane-left", "near-lane-right", "near-ft-left", "near-ft-right",
  "near-ft-top", "near-arc-left", "near-arc-right", "far-corner-left", "far-corner-right", "far-lane-left", "far-lane-right",
  "far-ft-left", "far-ft-right", "far-ft-top", "far-arc-left", "far-arc-right"];

// The 18 points drawn where they are, near end at the bottom (feet, as in film/interpret/court.py).
const COURT_NEAR = { "corner-left": [0, 0], "corner-right": [50, 0], "lane-left": [17, 0], "lane-right": [33, 0],
  "ft-left": [17, 19], "ft-right": [33, 19], "ft-top": [25, 25], "arc-left": [25 - Math.sqrt(19.75 ** 2 - 5.25 ** 2), 0],
  "arc-right": [25 + Math.sqrt(19.75 ** 2 - 5.25 ** 2), 0] };

function courtLayout() {
  try { return localStorage.getItem("courtLayout") || "across"; } catch (e) { return "across"; }
}

function courtDiagram() {
  // "across": the court runs left to right as a sideline camera sees it, near end on the left, so "left"
  // (your left standing on the near baseline facing up court) is the top sideline. "up": near end at the bottom.
  const across = courtLayout() === "across", S = 4, M = 70, MB = 24;
  const W = across ? 94 * S + 2 * M : 50 * S + 2 * M, H = across ? 50 * S + 2 * MB : 94 * S + 2 * MB;
  const at = (x, y) => across ? [M + y * S, MB + x * S] : [M + x * S, MB + (94 - y) * S];
  const [x0, y0] = at(0, across ? 0 : 94), [x1, y1] = at(50, across ? 94 : 0), [hx0, hy0] = at(0, 47), [hx1, hy1] = at(50, 47);
  let out = `<svg width="${W}" viewBox="0 0 ${W} ${H}" style="font:9px sans-serif;display:block">
    <rect x="${Math.min(x0, x1)}" y="${Math.min(y0, y1)}" width="${Math.abs(x1 - x0)}" height="${Math.abs(y1 - y0)}" fill="none" stroke="#888"/>
    <line x1="${hx0}" y1="${hy0}" x2="${hx1}" y2="${hy1}" stroke="#888"/>`;
  out += across
    ? `<text x="${M - 4}" y="${H / 2 + 3}" text-anchor="end" fill="#3ddc84">NEAR</text><text x="${W - M + 4}" y="${H / 2 + 3}" fill="#aaa">FAR</text>
       <text x="${W / 2}" y="10" text-anchor="middle" fill="#aaa">left sideline (your left standing on the near baseline)</text>`
    : `<text x="${W / 2}" y="${H - 4}" text-anchor="middle" fill="#3ddc84">NEAR: baseline lower in the picture</text><text x="${W / 2}" y="10" text-anchor="middle" fill="#aaa">FAR</text>`;
  // Court markings at both ends, drawn in feet through at(): the lane, the free-throw circle, and the
  // three-point arc with its straight legs to the baseline (same numbers as HALF on the shot card).
  const poly = (pts) => `<polyline points="${pts.map(([x, y]) => at(x, y).join(",")).join(" ")}" fill="none" stroke="#666"/>`;
  const circle = (cx, cy, rad) => poly(Array.from({ length: 49 }, (_, i) => [cx + rad * Math.cos(i / 48 * 2 * Math.PI), cy + rad * Math.sin(i / 48 * 2 * Math.PI)]));
  for (const far of [false, true]) {
    const f = ([x, y]) => far ? [50 - x, 94 - y] : [x, y];
    out += poly([[17, 0], [17, 19], [33, 19], [33, 0]].map(f));
    out += poly(Array.from({ length: 49 }, (_, i) => [25 + 19.75 * Math.cos(i / 48 * Math.PI), 5.25 + 19.75 * Math.sin(i / 48 * Math.PI)]).map(f));
    out += poly([[25 - 19.75, 0], [25 - 19.75, 5.25]].map(f)) + poly([[25 + 19.75, 0], [25 + 19.75, 5.25]].map(f));
    out += circle(...f([25, 19]), 6);
  }
  for (const [k, [nx, ny]] of Object.entries(COURT_NEAR)) {
    for (const [end, x, y] of [["near", nx, ny], ["far", 50 - nx, 94 - ny]]) {
      const [px, py] = at(x, y), name = `${end}-${k}`, near = end === "near";
      let label;
      if (across) {
        const left = k.endsWith("left") === near;                     // on the top sideline
        if (ny === 0) label = `<text x="${px + (near ? -5 : 5)}" y="${py + 3}" text-anchor="${near ? "end" : "start"}" fill="#ccc">${name}</text>`;
        else if (k === "ft-top") label = `<text x="${px}" y="${py + (near ? -6 : 12)}" text-anchor="middle" fill="#ccc">${name}</text>`;
        else label = `<text x="${px}" y="${py + (left ? -6 : 12)}" text-anchor="middle" fill="#ccc">${name}</text>`;
      } else {
        label = ny === 0
          ? `<text transform="translate(${px + 3},${py + (near ? 6 : -6)}) rotate(${near ? 90 : -90})" fill="#ccc">${name}</text>`
          : `<text x="${px + (k === "ft-top" ? 0 : (k.endsWith("left") === near ? -5 : 5))}" y="${py + (k === "ft-top" ? (near ? -6 : 12) : 3)}"
              text-anchor="${k === "ft-top" ? "middle" : (k.endsWith("left") === near ? "end" : "start")}" fill="#ccc">${name}</text>`;
      }
      out += `<circle cx="${px}" cy="${py}" r="3" fill="#3ddc84"/>${label}`;
    }
  }
  return out + "</svg>";
}

function renderCourtLabel() {
  const l = state.label;
  state.points = { ...(l.points || {}) };
  state.skippedPoints = new Set();
  state.pointIndex = COURT_POINTS.findIndex(n => !(n in state.points));
  state.img = null;
  $("#label").innerHTML = `<div class="row"><b>${l.remaining} pending</b><span class="muted">${esc(l.image_id)}</span></div>
    <div class="card wide" style="display:flex;gap:12px;align-items:flex-start">
      <div><canvas id="cv" class="${state.zoom ? "zoom" : ""}" width="${l.width}" height="${l.height}"></canvas>
      <div class="keys">Click where the highlighted point is. <kbd>N</kbd> not in view <kbd>Backspace</kbd> undo
        <kbd>Z</kbd> zoom <kbd>S</kbd> save <kbd>D</kbd> skip frame.<br>
        ${courtLayout() === "across"
          ? `<b>"near"</b> is the <b>left end</b> of the picture; <b>"left"</b> is your left standing on that baseline facing
             up the court, which is the <b>top sideline</b>. So near-corner-left is the top-left corner of the court in the
             picture and near-corner-right the bottom-left. The diagram is laid out the same way.`
          : `<b>"near"</b> is the end whose baseline is lower in the picture (closer to the camera); <b>"left"</b> is your left
             when you stand on that baseline facing up the court.`}
        When in doubt, skip the point with <kbd>N</kbd> rather than guess.
        <button class="btn" id="court-layout" style="margin-left:8px">${courtLayout() === "across" ? "Court across (sideline camera)" : "Court up the picture (end camera)"}: switch</button></div></div>
      <div><div id="pt-list" class="list" style="min-width:200px;max-height:none"></div>${courtDiagram()}</div></div>`;
  $("#court-layout").onclick = () => {
    try { localStorage.setItem("courtLayout", courtLayout() === "across" ? "up" : "across"); } catch (e) {}
    renderCourtLabel();
  };
  const img = new Image();
  img.onload = () => { if (state.label && state.label.image_id === l.image_id) { state.img = img; drawPoints(); } };
  img.src = l.image_url;
  $("#cv").onclick = (ev) => {
    if (!(state.pointIndex >= 0)) return;
    const p = canvasPos(ev);
    state.points[COURT_POINTS[state.pointIndex]] = [p.x, p.y];
    state.pointIndex = COURT_POINTS.findIndex((n, i) => i > state.pointIndex && !(n in state.points));
    drawPoints();
  };
  drawPoints();
}

function drawPoints() {
  const cv = $("#cv");
  if (!cv) return;
  if (state.img) {
    const ctx = cv.getContext("2d");
    ctx.drawImage(state.img, 0, 0);
    ctx.font = "16px sans-serif"; ctx.lineWidth = 2; ctx.strokeStyle = "#3ddc84"; ctx.fillStyle = "#3ddc84";
    for (const [name, [x, y]] of Object.entries(state.points)) {
      ctx.beginPath(); ctx.moveTo(x - 8, y); ctx.lineTo(x + 8, y); ctx.moveTo(x, y - 8); ctx.lineTo(x, y + 8); ctx.stroke();
      ctx.fillText(name.replace("near-", "n:").replace("far-", "f:"), x + 10, y - 6);
    }
  }
  $("#pt-list").innerHTML = COURT_POINTS.map((n, i) =>
    `<div class="${i === state.pointIndex ? "sel" : ""}">${n in state.points ? "✓" : state.skippedPoints.has(n) ? "–" : "·"} ${esc(n)}</div>`).join("");
}

async function courtKeys(ev) {
  const l = state.label;
  if (!l || l.done) return;
  const k = ev.key.toLowerCase();
  if (k === "n") {
    if (!(state.pointIndex >= 0)) return;
    state.skippedPoints.add(COURT_POINTS[state.pointIndex]);
    state.pointIndex = COURT_POINTS.findIndex((n, i) => i > state.pointIndex && !(n in state.points));
    drawPoints();
  } else if (ev.key === "Backspace") {
    const placed = Object.keys(state.points);
    if (placed.length) { const last = placed[placed.length - 1]; delete state.points[last]; state.skippedPoints.delete(last); state.pointIndex = COURT_POINTS.indexOf(last); drawPoints(); }
  } else if (k === "z") {
    state.zoom = !state.zoom; $("#cv").classList.toggle("zoom", state.zoom);
  } else if (k === "s") {
    await guarded(async () => { await post(`/api/label/court/${l.image_id}/points`, { points: state.points }); await loadLabel(); });
  } else if (k === "d") {
    await guarded(async () => { await post(`/api/label/court/${l.image_id}/skip`); await loadLabel(); });
  } else return;
  ev.preventDefault();
}

async function boxKeys(ev) {
  const l = state.label;
  if (!l || l.done) return;
  const names = CLASSES[state.tab];
  const k = ev.key.toLowerCase();
  if (ev.key === "Delete" || ev.key === "Backspace") {
    if (state.selected >= 0) { state.boxes.splice(state.selected, 1); state.selected = -1; drawBoxes(); }
  } else if (names[+ev.key - 1]) {
    if (state.selected >= 0) { state.boxes[state.selected].cls = names[+ev.key - 1]; drawBoxes(); }
  } else if (k === "s") {
    await guarded(async () => {
      await post(`/api/label/${state.tab}/${l.image_id}/boxes`, { boxes: state.boxes });
      await loadLabel();
    });
  } else if (k === "z") {
    state.zoom = !state.zoom;
    $("#cv").classList.toggle("zoom", state.zoom);
  } else if (k === "k" || k === "d") {          // D sits next to S: skip without moving the hand
    await guarded(async () => {
      await post(`/api/label/${state.tab}/${l.image_id}/skip`);
      await loadLabel();
    });
  } else return;
  ev.preventDefault();
}

document.addEventListener("keydown", (ev) => {
  if (ev.metaKey || ev.ctrlKey || ev.altKey || ev.repeat) return;
  if (state.tab === "shots") shotKeys(ev);
  else if (state.tab === "quarters") quarterKeys(ev);
  else if (state.tab === "rimclf") clipKeys(ev);
  else if (state.tab === "court") courtKeys(ev);
  else boxKeys(ev);
});
document.querySelectorAll("nav button").forEach(b => b.onclick = () => { state.tab = b.dataset.tab; render(); });
// A link such as /#ball opens straight on that tab.
const wanted = location.hash.slice(1);
if (["shots", "quarters", "rim", "ball", "rimclf", "court"].includes(wanted)) state.tab = wanted;
loadGames();
</script>
</body>
</html>
